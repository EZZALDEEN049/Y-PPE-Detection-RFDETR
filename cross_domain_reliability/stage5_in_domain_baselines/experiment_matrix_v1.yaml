stage: 5
name: harmonized_in_domain_baselines
status: pre_execution_stage4_5_closed

ontology:
  classes:
    - person
    - helmet
    - gloves
    - vest
    - boots
    - goggles
    - no_helmet
    - no_gloves
    - no_boots

frozen_datasets:
  Y-PPE-h9-v2:
    fingerprint_sha256: 82c08766d5c5e50e93d41d21c4751fd686a3932ea6a8cb24ffd2838d9e30fba8
    train_images: 1236
    val_images: 356
    test_images: 186
    retained_instances: 9471
  Construction-PPE-h9-v2:
    fingerprint_sha256: 59469299ba67355dbcb0e725851f73d244a7ad6e93522d44601be3c8323d3c14
    train_images: 1046
    val_images: 132
    test_images: 138
    retained_instances: 9514

shared_controls:
  epochs: 100
  resolution: 640
  seeds: [17, 42, 2026]
  pretrained: true
  early_stopping: false
  offline_augmentation: false
  stochastic_online_augmentation: false
  primary_checkpoint_policy: final_epoch
  test_for_tuning: false
  execution_environment: google_colab_single_nvidia_gpu
  minimum_vram_gib: 14.0
  resource_selection_basis: hardware_feasibility_only_no_performance_tuning

models:
  yolo11m:
    family: CNN_one_stage_detector
    implementation: ultralytics
    checkpoint: yolo11m.pt
    optimizer_policy: framework_native_recorded
    final_weight_policy: final_epoch_ema_last_pt
    batch_size: 8
    grad_accum_steps: null
    workers: 2
    amp: true
    hardware_lock_required: true
  rfdetr_small:
    family: transformer_detector
    implementation: rfdetr
    model_class: RFDETRSmall
    optimizer_policy: framework_native_recorded
    use_ema: true
    primary_final_weight_policy: final_epoch_ema_last_ema_pth
    batch_size: 1
    grad_accum_steps: 16
    effective_batch_size: 16
    workers: 2
    amp_dtype: fp16
    hardware_lock_required: true

runs:
  - {run_id: Y_YOLO_s17, dataset: Y-PPE-h9-v2, model: yolo11m, seed: 17}
  - {run_id: Y_YOLO_s42, dataset: Y-PPE-h9-v2, model: yolo11m, seed: 42}
  - {run_id: Y_YOLO_s2026, dataset: Y-PPE-h9-v2, model: yolo11m, seed: 2026}
  - {run_id: Y_RFDETR_s17, dataset: Y-PPE-h9-v2, model: rfdetr_small, seed: 17}
  - {run_id: Y_RFDETR_s42, dataset: Y-PPE-h9-v2, model: rfdetr_small, seed: 42}
  - {run_id: Y_RFDETR_s2026, dataset: Y-PPE-h9-v2, model: rfdetr_small, seed: 2026}
  - {run_id: C_YOLO_s17, dataset: Construction-PPE-h9-v2, model: yolo11m, seed: 17}
  - {run_id: C_YOLO_s42, dataset: Construction-PPE-h9-v2, model: yolo11m, seed: 42}
  - {run_id: C_YOLO_s2026, dataset: Construction-PPE-h9-v2, model: yolo11m, seed: 2026}
  - {run_id: C_RFDETR_s17, dataset: Construction-PPE-h9-v2, model: rfdetr_small, seed: 17}
  - {run_id: C_RFDETR_s42, dataset: Construction-PPE-h9-v2, model: rfdetr_small, seed: 42}
  - {run_id: C_RFDETR_s2026, dataset: Construction-PPE-h9-v2, model: rfdetr_small, seed: 2026}

gates:
  - stage4_5_label_completeness_closed_before_full_training
  - corrected_dataset_fingerprint_match
  - canonical_class_order_match
  - gpu_execution_parameters_frozen_before_training
  - actual_gpu_identity_recorded_before_first_run
  - no_test_tuning
  - common_evaluator_frozen_before_any_held_out_test_metrics
  - common_evaluator_frozen_before_zero_shot
