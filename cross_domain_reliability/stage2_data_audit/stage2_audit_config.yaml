secondary_dataset:
  SH17:
    expected_total_images: 8099
    expected_total_instances: 75994
    expected_class_count: 17
    numeric_class_order: pending_verification_from_actual_source_files
    raw_root_required: true
    role: secondary robustness only

harmonization_status:
  primary_strict_9_class_mapping:
    Persons: Person
    Hard Hat: helmet
    Gloves: gloves
    Safety Vests: vest
    Safety Boots: boots
    Goggles: goggles
    No Hard Hat: no_helmet
    No Gloves: no_gloves
    No Safety Boots: no_boots
  excluded_from_primary_mapping:
    - "Y-PPE No Safety Vest: Construction-PPE has no direct missing-vest class"
    - "Construction-PPE no_goggle: Y-PPE has no direct matching violation label"
    - "Construction-PPE none: no strict Y-PPE counterpart"

leakage_checks:
  - filename/stem overlap
  - SHA-256 exact bytes
  - decoded-pixel SHA-256
  - dHash near-duplicate candidate screening
  - source-URL overlap when source metadata are available
  - site/video/project cluster overlap when grouping metadata are available

near_duplicate_default_dhash_hamming_distance: 4

manual_semantic_audit_required:
  primary_violation_classes:
    - "No Hard Hat <-> no_helmet"
    - "No Gloves <-> no_gloves"
    - "No Safety Boots <-> no_boots"
  dimensions:
    - object definition
    - bounding-box target and geometry
    - occlusion and visibility policy
    - worn-versus-visible semantics
    - unlabeled visible objects

stage2_pass_requires:
  - raw annotation audit passes for Y-PPE and Construction-PPE
  - no unresolved exact cross-split duplicates
  - near-duplicate candidates manually adjudicated
  - primary-pair missing-PPE annotation geometry manually audited
  - numeric class-ID order frozen from actual dataset metadata
  - harmonized per-class split counts exported
