stage: 2
status: documentary_audit_complete_raw_audit_open

principles:
  - raw datasets remain read-only during audit
  - do not invent numeric class-ID order from class names
  - prefer each dataset's actual data.yaml for class ordering
  - exact cross-split duplicates must be resolved before experiments
  - perceptual near-duplicate hits are candidates requiring manual visual adjudication

