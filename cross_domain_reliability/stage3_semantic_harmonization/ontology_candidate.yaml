stage: 3
status: candidate_pending_semantic_audit
principle: >-
  A class is retained only if the two datasets represent the same operational object/state
  with sufficiently comparable bounding-box extent. Name similarity alone is not sufficient.
datasets:
  Y-PPE:
    person_class: Persons
    visual_audit_splits: [train, valid]
  Construction-PPE:
    person_class: Person
    visual_audit_splits: [train, val]
shared_classes:
  - canonical: person
    y_name: Persons
    c_name: Person
    role: human
  - canonical: helmet
    y_name: Hard Hat
    c_name: helmet
    role: compliant_ppe
  - canonical: gloves
    y_name: Gloves
    c_name: gloves
    role: compliant_ppe
  - canonical: vest
    y_name: Safety Vests
    c_name: vest
    role: compliant_ppe
  - canonical: boots
    y_name: Safety Boots
    c_name: boots
    role: compliant_ppe
  - canonical: goggles
    y_name: Goggles
    c_name: goggles
    role: compliant_ppe
  - canonical: no_helmet
    y_name: No Hard Hat
    c_name: no_helmet
    role: violation
  - canonical: no_gloves
    y_name: No Gloves
    c_name: no_gloves
    role: violation
  - canonical: no_boots
    y_name: No Safety Boots
    c_name: no_boots
    role: violation
excluded_from_shared_ontology:
  - dataset: Y-PPE
    class: No Safety Vest
    reason: Construction-PPE has no direct no-vest class.
  - dataset: Construction-PPE
    class: no_goggle
    reason: Y-PPE has no explicit No Goggles violation class.
  - dataset: Construction-PPE
    class: none
    reason: Semantics are not a direct Y-PPE class match and must not be inferred.
notes:
  - Test images are not used in the visual semantic audit.
  - Y-PPE polygon annotations, where present, are visualized through enclosing boxes for geometry comparison only; source annotations remain unchanged.
