name: V40-R8 internal document proof QA (offline; no release package)
on:
  push:
    branches: [research/v30-progressive-xai-2026-11-22]
    paths: [.github/workflows/seer-ppe-v40-r8-proof-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline dependencies
        run: |
          pip install pypandoc_binary python-docx pymupdf cairosvg pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation >/dev/null
      - name: Reproduce exact cluster analysis and internal proof
        run: |
          set -euo pipefail
          python research/seer-ppe/submissions/results-in-engineering/reviewer03_reproducibility/reproduce_cluster_sensitivity.py
          python - <<'PY'
          import re, zipfile, subprocess
          from pathlib import Path
          import fitz, pypandoc, cairosvg
          from docx import Document
          from docx.shared import Inches, Pt
          from docx.enum.section import WD_ORIENT
          root=Path("research/seer-ppe").resolve()
          sub=root/"submissions/results-in-engineering"
          out=Path("/tmp/v40_r8_internal_proof");out.mkdir()
          raster=out/"raster";raster.mkdir()
          # Use only the 14 validated R5 vector PDFs, not the superseded ZIP.
          artwork=sub/"artwork-publication/r5"
          figures=[f"Figure_{i}" for i in range(1,5)]+[f"Figure_S{i}" for i in range(1,11)]
          for name in figures:
              with fitz.open(artwork/(name+".pdf")) as pdf:
                  assert len(pdf)==1 and not pdf[0].get_images(full=True)
                  pdf[0].get_pixmap(dpi=500,alpha=False).save(raster/(name+".png"))
          ref=root/"exports/RINENG_V38C_Manuscript_v0.3_2026-11-23.docx"
          jobs=[
           ("RINENG_MANUSCRIPT_V40_BATCH01_WORKING_UNSIGNED_2026-11-24.md","Manuscript_INTERNAL.docx",False),
           ("RINENG_SUPPLEMENT_V40_S1_WORKING_UNSIGNED_2026-11-24.md","S1_INTERNAL.docx",True),
           ("RINENG_SUPPLEMENT_V40_S2_WORKING_UNSIGNED_2026-11-24.md","S2_INTERNAL.docx",True),
          ]
          for src,name,landscape in jobs:
              text=(sub/src).read_text(encoding="utf8")
              if not landscape:
                  blocks=re.findall(r"^\$\$\n[\s\S]*?\n\$\$$",text,re.M)
                  assert len(blocks)==7 and all(f"({i+1})" in b for i,b in enumerate(blocks)),blocks
                  assert not re.search(r"^\$$",text,re.M)
              text, count=re.subn(r"!\[([^\]]*)\]\(artwork-publication/r5/(Figure_(?:[1-4]|S(?:10|[1-9])))\.pdf\)",lambda m:f"![{m.group(1)}]({raster}/{m.group(2)}.png)",text)
              assert count==({"Manuscript_INTERNAL.docx":4,"S1_INTERNAL.docx":10,"S2_INTERNAL.docx":0}[name]), (name,count)
              path=out/name
              pypandoc.convert_text(text,"docx",format="markdown+tex_math_dollars",outputfile=str(path),extra_args=["--standalone","--reference-doc="+str(ref),"--resource-path="+str(sub)+":"+str(root)])
              doc=Document(path)
              for sec in doc.sections:
                  sec.page_width=Inches(11.69 if landscape else 8.27)
                  sec.page_height=Inches(8.27 if landscape else 11.69)
                  sec.orientation=WD_ORIENT.LANDSCAPE if landscape else WD_ORIENT.PORTRAIT
                  sec.left_margin=sec.right_margin=Inches(.7 if landscape else .85)
                  sec.top_margin=sec.bottom_margin=Inches(.75)
              for t in doc.tables:
                  for row in t.rows:
                      for cell in row.cells:
                          for p in cell.paragraphs:
                              for run in p.runs:
                                  if landscape:run.font.size=Pt(9)
              if name=="S1_INTERNAL.docx": assert len(doc.inline_shapes)==10
              if name=="S2_INTERNAL.docx": assert len(doc.tables)>0
              doc.save(path)
              subprocess.run(["python",str(root/"tools/v40_word_export_qa.py"),str(path)]+([] if landscape else ["--main"]),check=True)
              print("EDITABLE_WORD",name,len(doc.tables),len(doc.inline_shapes))
          PY
          mkdir -p /tmp/v40_r8_internal_proof/pdf
          libreoffice -env:UserInstallation=file:///tmp/v40r8_lo --headless --convert-to pdf --outdir /tmp/v40_r8_internal_proof/pdf /tmp/v40_r8_internal_proof/*.docx
          python - <<'PY'
          from pathlib import Path
          import re, json, fitz
          root=Path("/tmp/v40_r8_internal_proof/pdf")
          assert len(list(root.glob("*.pdf")))==3
          for p in root.glob("*.pdf"):
              with fitz.open(p) as pdf:
                  txt=" ".join(page.get_text() for page in pdf)
                  assert len(pdf)>0 and len(txt)>1000
                  print("PDF_PROOF",p.name,"pages",len(pdf),"word_tokens",len(txt.split()))
                  if p.name.startswith("Manuscript"):
                      for token in ["0.6490","0.5459","0.6709","0.8706","Figure 4.","10.5281/zenodo.24489644"]:
                          assert token in txt,token
                      assert "P=,R=" not in txt.replace(" ","")
                      # Report actual page positions of table captions for visual QA.
                      for i,pg in enumerate(pdf,1):
                          t=pg.get_text()
                          captions=re.findall(r"Table [456]\. [^\n]+",t)
                          if captions: print("TABLE_CAPTION_PAGE",i,captions)
                  assert "\\frac" not in txt
                  # Render contact sheets internally for review; do not distribute final manuscript.
                  from PIL import Image, ImageDraw
                  contact=root.parent/"qa";contact.mkdir(exist_ok=True)
                  for start in range(0,len(pdf),4):
                      canvas=Image.new("RGB",(1600,2000),"#e6e8eb")
                      draw=ImageDraw.Draw(canvas)
                      for j in range(start,min(start+4,len(pdf))):
                          pix=pdf[j].get_pixmap(matrix=fitz.Matrix(1.4,1.4),alpha=False)
                          im=Image.frombytes("RGB",(pix.width,pix.height),pix.samples)
                          im.thumbnail((770,960))
                          cx=((j-start)%2)*800;cy=((j-start)//2)*1000
                          draw.text((cx+10,cy+10),f"{p.stem} p{j+1}",fill="black")
                          canvas.paste(im,(cx+(800-im.width)//2,cy+30+(960-im.height)//2))
                      canvas.save(contact/f"{p.stem}_{start//4+1}.jpg",quality=88)
          print("R8_INTERNAL_PROOF_STRUCTURAL_PASS; visual and final release checks still required")
          PY
      - name: Remove temporary proof files
        if: always()
        run: rm -rf /tmp/v40_r8_internal_proof
