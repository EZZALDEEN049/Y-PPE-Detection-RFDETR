name: SEER-PPE V38B ONE-TIME AUTHORIZED REAL INFERENCE (hard 6000)
on:
  push:
    branches:
      - research/v30-progressive-xai-2026-11-22
    paths:
      - research/seer-ppe/V38_B_AUTHOR_ONE_TIME_EXECUTION_APPROVAL_2026-11-23.json
permissions:
  contents: write
concurrency:
  group: seer-ppe-v38b-one-time-real-inference-2026-11-23
  cancel-in-progress: false
jobs:
  one-time:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact author approval, frozen source and code blob SHAs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,hashlib,os
          from pathlib import Path
          root=Path('research/seer-ppe')
          a=json.loads((root/'V38_B_AUTHOR_ONE_TIME_EXECUTION_APPROVAL_2026-11-23.json').read_text())
          assert a['approval_source']=='user_explicit_instruction_2026_11_23_advance_to_actual_execution'
          assert a['authorized'] is True and a['approved_by_author'] is True
          assert a['study']=='V38_B_FROZEN_24_VALID_48_TARGETS'
          assert a['model_id']=='altayyar-0oflt-lafos-qqauz/2'
          assert a['max_attempted_model_calls']==6000 and a['intended_calls']==5200
          assert a['approved_credit_cost_limit']==1.125
          assert a['excluded_test'] is True and a['no_training'] is True and a['one_time'] is True
          assert a['wire_encoding']=='JPEG_quality_95_chroma_444_fixed_all_requests'
          assert os.environ['GITHUB_REF_NAME']=='research/v30-progressive-xai-2026-11-22'
          for p,expected in a['frozen_git_blob_sha1'].items():
              sha=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert sha==expected,('FROZEN_FILE_SHA_MISMATCH',p)
          assert len(a['frozen_git_blob_sha1'])==4
          m=root/'V38_B_FROZEN_CANDIDATE_SAMPLE_2026-11-23.json'
          assert len(json.loads(m.read_text())['images'])==24
          a['frozen_manifest_sha256']=hashlib.sha256(m.read_bytes()).hexdigest()
          auth=Path(os.environ['RUNNER_TEMP'])/'v38b_authorization_one_time_runtime.json'
          auth.write_text(json.dumps(a,indent=2)+'\n')
          print('V38B_EXPLICIT_AUTHOR_SCOPE_AND_FOUR_FROZEN_FILE_HASHES_PASS')
          print('V38B_CALL_LIMIT_6000_AND_ESTIMATED_CREDIT_LIMIT_1_125')
          PY
      - name: Create irreversible one-time repository execution lock BEFORE any model request
        run: |
          set -euo pipefail
          lock=research/seer-ppe/V38_B_PAID_EXECUTION_ONE_TIME_LOCK_2026-11-23.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          if git ls-files --error-unmatch "$lock" >/dev/null 2>&1; then
             echo "::error::One-time execution lock ALREADY EXISTS. Never rerun or double charge."
             exit 1
          fi
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          a=Path('research/seer-ppe/V38_B_AUTHOR_ONE_TIME_EXECUTION_APPROVAL_2026-11-23.json')
          lock=Path('research/seer-ppe/V38_B_PAID_EXECUTION_ONE_TIME_LOCK_2026-11-23.json')
          d={'schema_version':'seer-ppe/v38b-paid-execution-single-use-lock/v1',
            'status':'EXECUTION_AUTHORIZATION_CONSUMED_NO_AUTOMATIC_RERUN',
            'github_actions_run_id':os.environ['GITHUB_RUN_ID'],
            'github_actions_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'github_run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'authorization_file_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),
            'hard_max_attempts':6000,
            'no_test':True,
            'no_training':True,
            'not_a_result_or_achievement_claim':True}
          lock.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add "$lock"
          git commit -m "LOCK consumed one-time author-approved V38B hosted inference (max 6000)"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo 'V38B_ONE_TIME_EXECUTION_LOCK_PUBLISHED_BEFORE_PAID_API_CALLS'
      - name: Install local-only image and numeric dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Fetch precisely 24 SHA-frozen Valid original images read-only; no Test
        run: |
          set -euo pipefail
          python research/seer-ppe/tools/fetch_v38b_originals_cloud.py \
            --destination "${RUNNER_TEMP}/v38b_images" \
            --report "${RUNNER_TEMP}/v38b_readonly_source_check.json"
          python research/seer-ppe/tools/run_v38b_xai.py \
            --preflight --images-dir "${RUNNER_TEMP}/v38b_images" \
            --output "${RUNNER_TEMP}/v38b_preflight_only.json"
          echo 'V38B_24_CANONICAL_SOURCE_CHECKS_PASS_WITH_ZERO_HOSTED_CALLS'
      - name: Run EXACT ONE author-approved V38B real inference under write-ahead hard cap
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ROBOFLOW_API_KEY:-}" || { echo 'No approved Roboflow API secret found'; exit 1; }
          mkdir -p "${RUNNER_TEMP}/v38b_numeric"
          python -u research/seer-ppe/tools/run_v38b_xai.py \
            --execute \
            --images-dir "${RUNNER_TEMP}/v38b_images" \
            --authorization-file "${RUNNER_TEMP}/v38b_authorization_one_time_runtime.json" \
            --confirm-authorized-max-attempts 6000 \
            --output "${RUNNER_TEMP}/v38b_numeric/V38_B_ACTUAL_XAI_RESULTS_2026-11-23.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'v38b_numeric/V38_B_ACTUAL_XAI_RESULTS_2026-11-23.json'
          r=json.loads(out.read_text())
          assert r['status']=='COMPLETED'
          assert r['images_processed']==24 and len(r['per_image'])==24
          assert r['targets_total']==48 and r['calls_attempted']<=5200
          assert r['calls_succeeded']==r['calls_attempted']
          assert r['no_test_accessed'] and r['retrained'] is False
          print('V38B_HOSTED_RESULT_INTEGRITY_QA_PASS')
          print('IMAGES_PROCESSED',r['images_processed'])
          print('ACTUAL_MODEL_CALLS',r['calls_attempted'])
          PY
      - name: Archive numerical data and append-only attempted-call ledger as GitHub Actions artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v38b-authorized-real-inference-numeric-evidence-one-time
          path: |
            ${{ runner.temp }}/v38b_readonly_source_check.json
            ${{ runner.temp }}/v38b_numeric/*.json
            ${{ runner.temp }}/v38b_numeric/*.jsonl
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve results or failure evidence in GitHub research branch, without images
        if: ${{ always() }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/v38b_numeric"
          out=research/seer-ppe/outputs/v38b_authorized_2026-11-23
          mkdir -p "${RUNNER_TEMP}/v38b_archive_staging"
          if [ -d "$work" ]; then
            find "$work" -maxdepth 1 -type f \( -name '*.json' -o -name '*.jsonl' \) \
              -exec cp -n '{}' "${RUNNER_TEMP}/v38b_archive_staging/" \;
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'v38b_archive_staging'
          file=folder/'V38_B_ACTUAL_XAI_RESULTS_2026-11-23.json'
          status={'schema_version':'seer-ppe/v38b-one-time-execution-closure/v1',
                  'github_run_id':os.environ['GITHUB_RUN_ID'],
                  'authorization_consumed':True,
                  'no_automatic_retry':True,
                  'raw_photos_archived':False}
          if file.exists():
            d=json.loads(file.read_text())
            status.update({'status':d['status'],
                           'images_processed':d.get('images_processed'),
                           'calls_attempted':d.get('calls_attempted'),
                           'calls_succeeded':d.get('calls_succeeded')})
          else:
            f=folder/'V38_B_ACTUAL_XAI_RESULTS_2026-11-23.json.failed.json'
            if f.exists():
              d=json.loads(f.read_text())
              status.update({'status':'FAILED_WITH_ATTEMPTS',
                             'calls_attempted':d.get('calls_attempted'),
                             'calls_succeeded':d.get('calls_succeeded'),
                             'error_type':d.get('error_type')})
            else:
              status['status']='INCOMPLETE_OR_PREFLIGHT_ABORT'
          (folder/'V38_B_ONE_TIME_EXECUTION_CLOSURE_2026-11-23.json').write_text(json.dumps(status,indent=2)+'\n')
          print('V38B_FINAL_STATUS',status['status'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          if git ls-files --error-unmatch "$out/V38_B_ONE_TIME_EXECUTION_CLOSURE_2026-11-23.json" >/dev/null 2>&1; then
            echo "::error::An execution outcome for this one-time authorization already exists. Refusing overwrite."
            exit 1
          fi
          mkdir -p "$out"
          find "${RUNNER_TEMP}/v38b_archive_staging" -maxdepth 1 -type f \
            \( -name '*.json' -o -name '*.jsonl' \) -exec cp '{}' "$out/" \;
          git add "$out"
          git commit -m "Archive V38B one-time real inference result or failure and exact attempt ledger"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "V38B_ONE_TIME_NUMERICAL_EVIDENCE_ARCHIVED_ON_RESEARCH_BRANCH"
