name: SEER-PPE v0.43 manuscript editable Word export and QA
on:
  push:
    paths:
      - research/seer-ppe/WORD_EXPORT_REQUEST_2026-11-21_V01.md
      - research/seer-ppe/V35_D_WORD_EXPORT_REQUEST_2026-11-22.md
      - research/seer-ppe/MANUSCRIPT_MASTER.md
      - research/seer-ppe/SUPPLEMENTARY_MATERIALS_MASTER.md
      - .github/workflows/seer-ppe-word-export.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate_and_verify_word:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install markdown-to-Word converter
        run: |
          python -m pip install --disable-pip-version-check pypandoc_binary python-docx
      - name: Generate fully editable Word manuscripts from original checked-in Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.style import WD_STYLE_TYPE
          from docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          import pypandoc

          base=Path('research/seer-ppe')
          out=base/'exports'
          out.mkdir(parents=True,exist_ok=True)

          # Reference doc styles control editable Pandoc DOCX appearance.
          ref=Document()
          sec=ref.sections[0]
          sec.page_height=Inches(11.69)
          sec.page_width=Inches(8.27)
          sec.top_margin=Inches(.8)
          sec.bottom_margin=Inches(.8)
          sec.left_margin=Inches(.86)
          sec.right_margin=Inches(.80)
          sec.header_distance=Inches(.35)
          sec.footer_distance=Inches(.35)

          normal=ref.styles['Normal']
          normal.font.name='Aptos'
          normal.font.size=Pt(10.5)
          normal.font.color.rgb=RGBColor(34,46,60)
          normal.paragraph_format.space_after=Pt(6)
          normal.paragraph_format.line_spacing=1.12

          for idx,pt,color in [(1,16,RGBColor(19,51,82)),
                                (2,13,RGBColor(29,77,115)),
                                (3,11,RGBColor(35,84,117)),
                                (4,10,RGBColor(35,84,117))]:
              st=ref.styles[f'Heading {idx}']
              st.font.name='Aptos Display'
              st.font.size=Pt(pt)
              st.font.bold=True
              st.font.color.rgb=color
              st.paragraph_format.space_before=Pt(12)
              st.paragraph_format.space_after=Pt(5)
              st.paragraph_format.keep_with_next=True

          title=ref.styles['Title']
          title.font.name='Aptos Display'
          title.font.size=Pt(19)
          title.font.bold=True
          title.font.color.rgb=RGBColor(19,51,82)
          title.paragraph_format.space_after=Pt(9)

          for sty in ('Table Grid','Table Normal'):
              if sty in ref.styles:
                  st=ref.styles[sty]
                  st.font.name='Aptos'
                  st.font.size=Pt(9)

          if 'Source Code' not in ref.styles:
              st=ref.styles.add_style('Source Code',WD_STYLE_TYPE.PARAGRAPH)
          else: st=ref.styles['Source Code']
          st.font.name='Consolas'
          st.font.size=Pt(8)
          st.paragraph_format.space_after=Pt(4)

          h=sec.header.paragraphs[0]
          h.text='SEER-PPE  |  RESEARCH WORKING DRAFT'
          h.style=normal
          h.alignment=WD_ALIGN_PARAGRAPH.RIGHT
          for run in h.runs:
              run.font.size=Pt(8)
              run.font.color.rgb=RGBColor(95,110,125)
          f=sec.footer.paragraphs[0]
          f.alignment=WD_ALIGN_PARAGRAPH.RIGHT
          run=f.add_run('SEER-PPE  |  ')
          run.font.size=Pt(8)
          field=OxmlElement('w:fldSimple')
          field.set(qn('w:instr'),'PAGE')
          f._p.append(field)
          refpath=Path('/tmp/seer_ppe_reference.docx')
          ref.save(refpath)

          jobs=[
            (base/'MANUSCRIPT_MASTER.md',
             out/'SEER_PPE_Research_Manuscript_v0.43_2026-11-22.docx',
             'SEER-PPE Research Manuscript v0.43'),
            (base/'SUPPLEMENTARY_MATERIALS_MASTER.md',
             out/'SEER_PPE_Supplementary_Material_v0.43_2026-11-22.docx',
             'SEER-PPE Supplementary Material v0.43')
          ]
          for source,target,subject in jobs:
              assert source.exists() and len(source.read_text(encoding='utf8'))>15000,source
              pypandoc.convert_file(str(source),to='docx',format='markdown',
                  outputfile=str(target),
                  extra_args=['--standalone',
                              '--resource-path=research/seer-ppe'])
              d=Document(target)
              # Keep Pandoc's native Word table structures intact; do not rewrite tblGrid/tcW.
              d.core_properties.author='Ezzaldeen Al-Tayar'
              d.core_properties.title=subject
              d.core_properties.subject='Academic research working draft and reproducibility handoff'
              d.save(target)
              assert target.stat().st_size>15000,target
              print(f'GENERATED {target} | bytes={target.stat().st_size} | paragraphs={len(d.paragraphs)} | tables={len(d.tables)}')
          print('SEER_PPE_V043_EDITABLE_MANUSCRIPT_GENERATED_FROM_SOURCE_MARKDOWN')
          PY
      - name: Verify v0.43 Word structure, all source content and embedded figures
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import zipfile
          b=Path('research/seer-ppe/exports')
          manuscript=b/'SEER_PPE_Research_Manuscript_v0.43_2026-11-22.docx'
          supplement=b/'SEER_PPE_Supplementary_Material_v0.43_2026-11-22.docx'
          for path,expected_media in ((manuscript,1),(supplement,10)):
              assert path.exists() and path.stat().st_size>15000,path
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None,path
                  media=[n for n in z.namelist() if n.startswith('word/media/') and not n.endswith('/')]
                  assert len(media)==expected_media,(path,len(media),media)
                  print('DOCX_EMBEDDED_FIGURES_OK',path.name,len(media))
          d=Document(manuscript)
          assert len(d.tables)==16,len(d.tables)
          nonempty_cells=sum(1 for t in d.tables for row in t.rows for cell in row.cells if cell.text.strip())
          assert nonempty_cells>60,nonempty_cells
          assert any('Cohort' in t.rows[0].cells[0].text for t in d.tables)
          assert any('Original class name' in t.rows[0].cells[0].text for t in d.tables)
          print('DOCX_NATIVE_MAIN_TABLES_OK',len(d.tables),'tables',nonempty_cells,'nonempty cells')
          mt='\\n'.join(p.text for p in d.paragraphs)+'\\n'+'\\n'.join(' '.join(c.text for c in row.cells) for t in d.tables for row in t.rows)
          assert len(mt)>20000,len(mt)
          for value in (
              'Ezzaldeen Al-Tayar','Taiz University','azzaltayyar@gmail.com',
              'Results','Discussion','Limitations','Conclusion','References','Supplementary Material',
              '0.870610','3,297','4,103','0.5416','0.4239','65%','Figure 1.',
              'Petsiuk','Adebayo','Kendall',
              '10.1109/ICCV.2017.371','10.1093/biomet/30.1-2.81',
              '10.3389/fbuil.2026.1976288','10.1016/j.engappai.2026.115725'
          ):
              assert value in mt,value
          sd=Document(supplement)
          st='\\n'.join(p.text for p in sd.paragraphs)+'\\n'+'\\n'.join(' '.join(c.text for c in row.cells) for t in sd.tables for row in t.rows)
          assert 'Supplementary Method S1.' in st
          assert 'Appendix X.' in st
          assert 'Supplementary Figure S1.' in st and 'Supplementary Figure S10.' in st
          assert len(st)>30000,len(st)
          print('DOCX_MAIN_AND_SUPPLEMENT_CONTENT_OK',len(mt),len(st))
          PY
      - name: Render v0.43 main and supplementary Word files to PDF
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer poppler-utils >/dev/null
          fi
          mkdir -p /tmp/seer_ppe_word_render
          libreoffice -env:UserInstallation=file:///tmp/lo_seer_ppe_word_export --headless --convert-to pdf --outdir /tmp/seer_ppe_word_render research/seer-ppe/exports/SEER_PPE_Research_Manuscript_v0.43_2026-11-22.docx
          libreoffice -env:UserInstallation=file:///tmp/lo_seer_ppe_word_export --headless --convert-to pdf --outdir /tmp/seer_ppe_word_render research/seer-ppe/exports/SEER_PPE_Supplementary_Material_v0.43_2026-11-22.docx
          pdf=/tmp/seer_ppe_word_render/SEER_PPE_Research_Manuscript_v0.43_2026-11-22.pdf
          supp_pdf=/tmp/seer_ppe_word_render/SEER_PPE_Supplementary_Material_v0.43_2026-11-22.pdf
          test -s "$pdf" && test -s "$supp_pdf"
          pdfinfo "$pdf" | grep Pages
          pdfinfo "$supp_pdf" | grep Pages
          pdftotext -layout "$pdf" /tmp/seer_ppe_word_render/manuscript.txt
          pdftotext -layout "$supp_pdf" /tmp/seer_ppe_word_render/supplement.txt
          pdftotext -f 1 -l 1 -layout "$pdf" /tmp/seer_ppe_word_render/first_page.txt
          ! grep -q 'Table of Contents' /tmp/seer_ppe_word_render/first_page.txt
          grep -q 'SEER-PPE: Selective Evidence' /tmp/seer_ppe_word_render/first_page.txt
          grep -q 'Conclusion' /tmp/seer_ppe_word_render/manuscript.txt
          grep -q 'References' /tmp/seer_ppe_word_render/manuscript.txt
          grep -q 'Figure 1' /tmp/seer_ppe_word_render/manuscript.txt
          grep -q 'Supplementary Figure S10' /tmp/seer_ppe_word_render/supplement.txt
          pdftoppm -f 1 -l 1 -scale-to 1000 -png -singlefile "$pdf" /tmp/seer_ppe_word_render/first_page
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          middle=$(( (pages + 1) / 2 ))
          pdftoppm -f "$middle" -l "$middle" -scale-to 1000 -png -singlefile "$pdf" /tmp/seer_ppe_word_render/middle_page
          pdftoppm -f "$pages" -l "$pages" -scale-to 1000 -png -singlefile "$pdf" /tmp/seer_ppe_word_render/last_page
          supp_pages=$(pdfinfo "$supp_pdf" | awk '/^Pages:/ {print $2}')
          pdftoppm -f 1 -l 1 -scale-to 1000 -png -singlefile "$supp_pdf" /tmp/seer_ppe_word_render/supp_first_page
          pdftoppm -f "$supp_pages" -l "$supp_pages" -scale-to 1000 -png -singlefile "$supp_pdf" /tmp/seer_ppe_word_render/supp_last_page
          test -s /tmp/seer_ppe_word_render/first_page.png
          test -s /tmp/seer_ppe_word_render/middle_page.png
          test -s /tmp/seer_ppe_word_render/last_page.png
          test -s /tmp/seer_ppe_word_render/supp_first_page.png
          test -s /tmp/seer_ppe_word_render/supp_last_page.png
          echo 'SEER_PPE_V043_MAIN_AND_SUPPLEMENT_PDF_QA_PASS'
      - name: Upload temporary PDF and page previews for V35-E visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: seer-ppe-v043-main-supplement-qa
          path: |
            /tmp/seer_ppe_word_render/SEER_PPE_Research_Manuscript_v0.43_2026-11-22.pdf
            /tmp/seer_ppe_word_render/SEER_PPE_Supplementary_Material_v0.43_2026-11-22.pdf
            research/seer-ppe/exports/SEER_PPE_Research_Manuscript_v0.43_2026-11-22.docx
            research/seer-ppe/exports/SEER_PPE_Supplementary_Material_v0.43_2026-11-22.docx
            /tmp/seer_ppe_word_render/first_page.png
            /tmp/seer_ppe_word_render/middle_page.png
            /tmp/seer_ppe_word_render/last_page.png
            /tmp/seer_ppe_word_render/supp_first_page.png
            /tmp/seer_ppe_word_render/supp_last_page.png
          if-no-files-found: error
          retention-days: 7
      - name: Archive editable v0.43 Word manuscript on the current research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/seer-ppe/exports/SEER_PPE_Research_Manuscript_v0.43_2026-11-22.docx research/seer-ppe/exports/SEER_PPE_Supplementary_Material_v0.43_2026-11-22.docx
          git diff --cached --quiet && exit 0
          git commit -m 'docs(seer-ppe): archive main and supplementary Word files v0.43'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
