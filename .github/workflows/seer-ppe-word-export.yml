name: SEER-PPE v0.39 manuscript editable Word export and QA
on:
  push:
    paths:
      - research/seer-ppe/WORD_EXPORT_REQUEST_2026-11-21_V01.md
      - research/seer-ppe/V35_D_WORD_EXPORT_REQUEST_2026-11-22.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate_and_verify_word:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install markdown-to-Word converter
        run: |
          python -m pip install --disable-pip-version-check pypandoc_binary python-docx
      - name: Generate fully editable Word manuscripts from original checked-in Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.style import WD_STYLE_TYPE
          from docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          import pypandoc

          base=Path('research/seer-ppe')
          out=base/'exports'
          out.mkdir(parents=True,exist_ok=True)

          # Reference doc styles control editable Pandoc DOCX appearance.
          ref=Document()
          sec=ref.sections[0]
          sec.page_height=Inches(11.69)
          sec.page_width=Inches(8.27)
          sec.top_margin=Inches(.8)
          sec.bottom_margin=Inches(.8)
          sec.left_margin=Inches(.86)
          sec.right_margin=Inches(.80)
          sec.header_distance=Inches(.35)
          sec.footer_distance=Inches(.35)

          normal=ref.styles['Normal']
          normal.font.name='Aptos'
          normal.font.size=Pt(10.5)
          normal.font.color.rgb=RGBColor(34,46,60)
          normal.paragraph_format.space_after=Pt(6)
          normal.paragraph_format.line_spacing=1.12

          for idx,pt,color in [(1,16,RGBColor(19,51,82)),
                                (2,13,RGBColor(29,77,115)),
                                (3,11,RGBColor(35,84,117)),
                                (4,10,RGBColor(35,84,117))]:
              st=ref.styles[f'Heading {idx}']
              st.font.name='Aptos Display'
              st.font.size=Pt(pt)
              st.font.bold=True
              st.font.color.rgb=color
              st.paragraph_format.space_before=Pt(12)
              st.paragraph_format.space_after=Pt(5)
              st.paragraph_format.keep_with_next=True

          title=ref.styles['Title']
          title.font.name='Aptos Display'
          title.font.size=Pt(19)
          title.font.bold=True
          title.font.color.rgb=RGBColor(19,51,82)
          title.paragraph_format.space_after=Pt(9)

          for sty in ('Table Grid','Table Normal'):
              if sty in ref.styles:
                  st=ref.styles[sty]
                  st.font.name='Aptos'
                  st.font.size=Pt(9)

          if 'Source Code' not in ref.styles:
              st=ref.styles.add_style('Source Code',WD_STYLE_TYPE.PARAGRAPH)
          else: st=ref.styles['Source Code']
          st.font.name='Consolas'
          st.font.size=Pt(8)
          st.paragraph_format.space_after=Pt(4)

          h=sec.header.paragraphs[0]
          h.text='SEER-PPE  |  RESEARCH WORKING DRAFT'
          h.style=normal
          h.alignment=WD_ALIGN_PARAGRAPH.RIGHT
          for run in h.runs:
              run.font.size=Pt(8)
              run.font.color.rgb=RGBColor(95,110,125)
          f=sec.footer.paragraphs[0]
          f.alignment=WD_ALIGN_PARAGRAPH.RIGHT
          run=f.add_run('SEER-PPE  |  ')
          run.font.size=Pt(8)
          field=OxmlElement('w:fldSimple')
          field.set(qn('w:instr'),'PAGE')
          f._p.append(field)
          refpath=Path('/tmp/seer_ppe_reference.docx')
          ref.save(refpath)

          jobs=[
            (base/'MANUSCRIPT_MASTER.md',
             out/'SEER_PPE_Research_Manuscript_v0.39_2026-11-22.docx',
             'SEER-PPE Research Manuscript v0.39')
          ]
          for source,target,subject in jobs:
              assert source.exists() and len(source.read_text(encoding='utf8'))>15000,source
              pypandoc.convert_file(str(source),to='docx',format='markdown',
                  outputfile=str(target),
                  extra_args=['--standalone',
                              '--resource-path=research/seer-ppe',
                              '--reference-doc='+str(refpath)])
              d=Document(target)
              # Pandoc emits tables at 50% width by default in this reference template.
              # Expand every editable table to the full printable width and keep headers readable.
              usable_twips=9520
              for table in d.tables:
                  ncols=len(table.columns)
                  if ncols>=9: first=2000
                  elif ncols>=7: first=2500
                  elif ncols>=6: first=2700
                  elif ncols==5: first=3000
                  elif ncols==4: first=3200
                  elif ncols==3: first=3500
                  elif ncols==2: first=3600
                  else: first=usable_twips
                  if ncols>1:
                      rest=(usable_twips-first)//(ncols-1)
                      widths=[first]+[rest]*(ncols-1)
                      widths[-1]=usable_twips-sum(widths[:-1])
                  else:
                      widths=[usable_twips]
                  table.style='Table Grid'
                  table.alignment=WD_TABLE_ALIGNMENT.CENTER
                  table.autofit=False
                  tblPr=table._tbl.tblPr
                  tblW=tblPr.find(qn('w:tblW'))
                  if tblW is None:
                      tblW=OxmlElement('w:tblW')
                      tblPr.append(tblW)
                  tblW.set(qn('w:w'),'10000')
                  tblW.set(qn('w:type'),'pct')
                  tblLayout=tblPr.find(qn('w:tblLayout'))
                  if tblLayout is None:
                      tblLayout=OxmlElement('w:tblLayout')
                      tblPr.append(tblLayout)
                  tblLayout.set(qn('w:type'),'fixed')
                  for j,gridcol in enumerate(table._tbl.tblGrid.gridCol_lst):
                      gridcol.set(qn('w:w'),str(widths[j]))
                      table.columns[j].width=Inches(widths[j]/1440)
                  fontsize=7.5 if ncols>=9 else 8 if ncols>=7 else 8.5 if ncols>=5 else 9
                  for ri,row in enumerate(table.rows):
                      trPr=row._tr.get_or_add_trPr()
                      if trPr.find(qn('w:cantSplit')) is None:
                          trPr.append(OxmlElement('w:cantSplit'))
                      if ri==0 and trPr.find(qn('w:tblHeader')) is None:
                          hdr=OxmlElement('w:tblHeader')
                          hdr.set(qn('w:val'),'true')
                          trPr.append(hdr)
                      for j,cell in enumerate(row.cells):
                          cell.width=Inches(widths[j]/1440)
                          cell.vertical_alignment=WD_CELL_VERTICAL_ALIGNMENT.CENTER
                          tcPr=cell._tc.get_or_add_tcPr()
                          tcW=tcPr.find(qn('w:tcW'))
                          if tcW is None:
                              tcW=OxmlElement('w:tcW')
                              tcPr.append(tcW)
                          tcW.set(qn('w:w'),str(widths[j]))
                          tcW.set(qn('w:type'),'dxa')
                          tcMar=tcPr.find(qn('w:tcMar'))
                          if tcMar is None:
                              tcMar=OxmlElement('w:tcMar')
                              tcPr.append(tcMar)
                          for side in ('top','start','bottom','end'):
                              margin=tcMar.find(qn('w:'+side))
                              if margin is None:
                                  margin=OxmlElement('w:'+side)
                                  tcMar.append(margin)
                              margin.set(qn('w:w'),'45')
                              margin.set(qn('w:type'),'dxa')
                          for para in cell.paragraphs:
                              para.paragraph_format.space_after=Pt(0)
                              para.paragraph_format.line_spacing=1.0
                              if j>0:
                                  para.alignment=WD_ALIGN_PARAGRAPH.CENTER
                              for run in para.runs:
                                  run.font.size=Pt(fontsize)
                                  if ri==0:
                                      run.bold=True
              d.core_properties.author='Ezzaldeen Al-Tayar'
              d.core_properties.title=subject
              d.core_properties.subject='Academic research working draft and reproducibility handoff'
              d.save(target)
              assert target.stat().st_size>15000,target
              print(f'GENERATED {target} | bytes={target.stat().st_size} | paragraphs={len(d.paragraphs)} | tables={len(d.tables)}')
          print('SEER_PPE_V039_EDITABLE_MANUSCRIPT_GENERATED_FROM_SOURCE_MARKDOWN')
          PY
      - name: Verify v0.39 Word structure, all source content and embedded figures
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import zipfile
          b=Path('research/seer-ppe/exports')
          manuscript=b/'SEER_PPE_Research_Manuscript_v0.39_2026-11-22.docx'
          assert manuscript.exists() and manuscript.stat().st_size>15000
          with zipfile.ZipFile(manuscript) as z:
              assert z.testzip() is None
              media=[n for n in z.namelist() if n.startswith('word/media/') and not n.endswith('/')]
              assert len(media)==11, (len(media), media)
              print('DOCX_EMBEDDED_FIGURES_OK',len(media))
          d=Document(manuscript)
          from docx.oxml.ns import qn
          for i,t in enumerate(d.tables):
              tw=t._tbl.tblPr.find(qn('w:tblW'))
              assert tw is not None and tw.get(qn('w:w'))=='10000' and tw.get(qn('w:type'))=='pct',(i,tw.xml if tw is not None else None)
              widths=[int(g.get(qn('w:w'))) for g in t._tbl.tblGrid.gridCol_lst]
              assert sum(widths)==9520,(i,widths,sum(widths))
          print('DOCX_TABLE_WIDTHS_OK',len(d.tables),'tables at 100% printable width')
          mt='\\n'.join(p.text for p in d.paragraphs)+'\\n'+'\\n'.join(' '.join(c.text for c in row.cells) for t in d.tables for row in t.rows)
          assert len(mt)>20000, len(mt)
          for value in (
              'Ezzaldeen Al-Tayar','Taiz University','azzaltayyar@gmail.com',
              'Results','Discussion','Limitations','Conclusion','References',
              '0.870610','3,297','4,103','0.5416','0.4239','65%',
              'Appendix X.','Figure 11.','Petsiuk','Adebayo','Kendall',
              '10.1109/ICCV.2017.371','10.1093/biomet/30.1-2.81',
              '10.3389/fbuil.2026.1976288','10.1016/j.engappai.2026.115725'
          ):
              assert value in mt, value
          print('DOCX_CONTENT_OK',len(mt),'chars',len(d.tables),'tables')
          PY
      - name: Render v0.39 Word manuscript to PDF and check key content
        run: |
          set -euo pipefail
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer poppler-utils >/dev/null
          fi
          mkdir -p /tmp/seer_ppe_word_render
          libreoffice -env:UserInstallation=file:///tmp/lo_seer_ppe_word_export --headless --convert-to pdf --outdir /tmp/seer_ppe_word_render research/seer-ppe/exports/SEER_PPE_Research_Manuscript_v0.39_2026-11-22.docx
          pdf=/tmp/seer_ppe_word_render/SEER_PPE_Research_Manuscript_v0.39_2026-11-22.pdf
          test -s "$pdf"
          pdfinfo "$pdf" | grep Pages
          pdftotext -layout "$pdf" /tmp/seer_ppe_word_render/manuscript.txt
          pdftotext -f 1 -l 1 -layout "$pdf" /tmp/seer_ppe_word_render/first_page.txt
          ! grep -q 'Table of Contents' /tmp/seer_ppe_word_render/first_page.txt
          grep -q 'SEER-PPE: Selective Evidence' /tmp/seer_ppe_word_render/first_page.txt
          grep -q 'SEER-PPE' /tmp/seer_ppe_word_render/manuscript.txt
          grep -q 'Conclusion' /tmp/seer_ppe_word_render/manuscript.txt
          grep -q 'References' /tmp/seer_ppe_word_render/manuscript.txt
          grep -q 'Figure 11' /tmp/seer_ppe_word_render/manuscript.txt
          pdftoppm -f 1 -l 1 -scale-to 1000 -png -singlefile "$pdf" /tmp/seer_ppe_word_render/first_page
          test -s /tmp/seer_ppe_word_render/first_page.png
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          middle=$(( (pages + 1) / 2 ))
          pdftoppm -f "$middle" -l "$middle" -scale-to 1000 -png -singlefile "$pdf" /tmp/seer_ppe_word_render/middle_page
          pdftoppm -f "$pages" -l "$pages" -scale-to 1000 -png -singlefile "$pdf" /tmp/seer_ppe_word_render/last_page
          test -s /tmp/seer_ppe_word_render/middle_page.png
          test -s /tmp/seer_ppe_word_render/last_page.png
          echo 'SEER_PPE_V039_DOCX_PDF_TEXT_AND_THREE_PAGE_PREVIEW_QA_PASS'
      - name: Upload temporary PDF and page previews for V35-E visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: seer-ppe-v039-render-qa
          path: |
            /tmp/seer_ppe_word_render/SEER_PPE_Research_Manuscript_v0.39_2026-11-22.pdf
            research/seer-ppe/exports/SEER_PPE_Research_Manuscript_v0.39_2026-11-22.docx
            /tmp/seer_ppe_word_render/first_page.png
            /tmp/seer_ppe_word_render/middle_page.png
            /tmp/seer_ppe_word_render/last_page.png
          if-no-files-found: error
          retention-days: 7
      - name: Archive editable v0.39 Word manuscript on the current research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/seer-ppe/exports/SEER_PPE_Research_Manuscript_v0.39_2026-11-22.docx
          git diff --cached --quiet && exit 0
          git commit -m 'docs(seer-ppe): archive editable Word manuscript v0.39'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
