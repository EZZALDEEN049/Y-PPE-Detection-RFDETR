name: SEER-PPE source and reference readiness (research-only)
on:
  push:
    paths:
      - 'research/seer-ppe/**'
      - '.github/workflows/seer-ppe-source-reference-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only_pre_scoring_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout frozen research records
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-test dependency (synthetic images only)
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify original combined source-gate self-test
        run: node research/seer-ppe/tools/source_integrity_readiness_gate.mjs --self-test
      - name: Verify source-integrity gate fails closed on current research data
        run: |
          set -euo pipefail
          node research/seer-ppe/tools/source_integrity_readiness_gate.mjs > /tmp/seer-source-gate.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const x=JSON.parse(fs.readFileSync("/tmp/seer-source-gate.json","utf8"));
            assert.equal(x.model_metric_scoring_ready,false);
            assert.equal(x.specific_source_hold_count,5);
            assert.equal(x.unadjudicated_exact_filename_collision_valid_count,26);
            assert.equal(x.no_test_image_inspection_or_inference_by_this_gate,true);
            process.stdout.write("CURRENT_SOURCE_INTEGRITY_GATE_FAIL_CLOSED_PASS\\n");
          '
      - name: Verify existing Person–PPE structural review validator self-test
        run: node research/seer-ppe/tools/validate_reference.mjs --self-test
      - name: Verify synthetic byte/pixel/dHash image audit self-test
        run: python research/seer-ppe/tools/source_pixel_hash_audit.py --self-test
      - name: Verify saved two-track evidence is internally consistent and not scoring-ready
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root='research/seer-ppe/';
          const read=name=>JSON.parse(fs.readFileSync(root+name,'utf8'));
          const source=read('SOURCE_ID_MANIFEST_TRAIN_VALID_2026-11-19_V01.json');
          const union=read('UNIFIED_TRAIN_VALID_TRIAGE_2026-11-21_V01.json');
          const human=read('PERSON_PPE_LIVE_READINESS_2026-11-21_V01.json');
          const checkpoint=read('DUAL_TRACK_CHECKPOINT_2026-11-21.json');
          const expanded=read('UNIFIED_TRAIN_VALID_TRIAGE_2026-11-21_V02.json');
          const pairAudit=read('SOURCE_MEDIA_PAIR_VISUAL_TRIAGE_2026-11-21_V01.json');
          const pairAuditV2=read('SOURCE_MEDIA_PAIR_VISUAL_TRIAGE_2026-11-21_V02.json');
          const highSim=read('EMBEDDING_HIGH_SIM_VISUAL_TRIAGE_2026-11-21_V01.json');
          const caseB=read('CASE_B_AI_VISIBILITY_PREFLIGHT_2026-11-21_V01.json');
          assert.equal(source.images.length,2093);
          assert.equal(source.images.filter(x=>x.split==='train').length,1625);
          assert.equal(source.images.filter(x=>x.split==='valid').length,468);
          assert.equal(source.images.filter(x=>x.split==='test').length,0);
          assert.equal(new Set(source.images.map(x=>x.image_id)).size,2093);
          assert.equal(union.unique_valid_triage_rows,79);
          assert.equal(union.prior_valid_holds_not_changed,5);
          assert.equal(new Set(union.prioritization.map(x=>x.valid_id)).size,79);
          assert.equal(union.scoring_ready,false);
          assert.equal(expanded.unique_valid_triage_rows,83);
          assert.equal(expanded.new_unique_valid_review_ids.length,4);
          assert.equal(expanded.prior_valid_holds_not_changed,5);
          assert.equal(new Set(expanded.prioritization.map(x=>x.valid_id)).size,83);
          assert.equal(expanded.scoring_ready,false);
          assert.equal(expanded.tests_accessed,false);
          assert.equal(pairAudit.coverage.single_images_analyzed,6);
          assert.equal(pairAudit.coverage.pairs_analyzed,3);
          assert.equal(pairAudit.coverage.test_images_analyzed,0);
          assert.equal(pairAudit.coverage.existing_valid_review_queue_size,83);
          assert.equal(pairAudit.coverage.previous_specific_valid_holds_unchanged,5);
          assert.equal(pairAudit.reviewed_pairs.length,3);
          assert.ok(pairAudit.reviewed_pairs.every(x=>x.human_pairwise_adjudicated===false&&x.source_image_bytes_hashed===false&&x.eligibility_status_change==='NONE'));
          assert.equal(pairAudit.scientific_metrics_scoring_ready,false);
          assert.equal(pairAuditV2.coverage.source_annotation_readback_images,6);
          assert.equal(pairAuditV2.coverage.source_annotation_readback_valid,6);
          assert.equal(pairAuditV2.native_annotation_readback_summary.inspected_sapi_images,4);
          assert.equal(pairAuditV2.native_annotation_readback_summary.sapi_original_Animal_boxes,14);
          assert.equal(pairAuditV2.native_annotation_readback_summary.sapi_original_Persons_boxes,0);
          assert.equal(pairAuditV2.native_annotation_readback_summary.unesco_source_person_boxes_valid,6);
          assert.equal(pairAuditV2.native_annotation_readback_summary.unesco_source_person_boxes_train,7);
          assert.equal(pairAuditV2.scientific_metrics_scoring_ready,false);
          assert.ok(pairAuditV2.reviewed_pairs.every(x=>x.native_saved_source_annotation_readback.length===2&&x.source_image_bytes_hashed===false));
          assert.equal(highSim.pair_count,5);
          assert.equal(highSim.original_images_read_as_ai_visual,10);
          assert.equal(highSim.all_annotation_records_valid,true);
          assert.equal(highSim.review_queue_valid_count_unchanged,83);
          assert.equal(highSim.previous_specific_valid_source_holds_unchanged,5);
          assert.equal(highSim.source_pixel_sha256_computed,false);
          assert.equal(highSim.model_scoring_ready,false);
          assert.ok(highSim.pairs.every(x=>x.human_pair_signoff==='PENDING'&&x.original_source_byte_verdict==='NOT_TESTED'&&x.new_source_hold_created===false));
          assert.equal(new Set(highSim.pairs.map(x=>x.valid.id)).size,5);
          assert.ok(highSim.pairs.every(x=>expanded.prioritization.some(q=>q.valid_id===x.valid.id)));
          assert.equal(caseB.live_eval_case_revision,2);
          assert.equal(caseB.live_eval_ground_truth_state,'incomplete');
          assert.equal(caseB.live_matched_item_owner_links,4);
          assert.equal(caseB.live_recorded_visual_states,8);
          assert.equal(caseB.review_items.length,4);
          assert.deepEqual([...caseB.missing_visual_states].sort(),[
            'P001:face_mask','P001:safety_boot','P002:face_mask','P002:safety_boot'
          ].sort());
          assert.ok(caseB.review_items.every(x=>x.human_final_state===null&&x.human_signoff===null&&x.current_ground_truth==='MISSING_REVIEW'));
          assert.equal(caseB.eval_ground_truth_modified,false);
          assert.equal(caseB.case_complete,false);
          assert.equal(caseB.scoring_ready,false);
          const prior=new Set(union.prioritization.map(x=>x.valid_id));
          assert.ok([...prior].every(id=>expanded.prioritization.some(x=>x.valid_id===id)));
          assert.equal(union.original_source_bytes_acquired,false);
          assert.equal(human.totals.associations,19);
          assert.equal(human.totals.visual_reviewed_cells,38);
          assert.equal(human.totals.visual_missing_cells,4);
          assert.equal(human.cases.length,4);
          assert.ok(human.cases.every(x=>x.ground_truth_state==='incomplete'));
          assert.equal(human.case_completion_ready,false);
          assert.equal(human.model_scoring_ready,false);
          assert.equal(checkpoint.metrics_scoring_ready,false);
          assert.equal(checkpoint.test_newly_accessed,false);
          console.log('TWO_TRACK_SAVED_EVIDENCE_FAIL_CLOSED_PASS');
          JS
      - name: Verify V06 source-family review evidence remains fail-closed
        run: node research/seer-ppe/tools/validate_v06_source_review_gate.mjs
      - name: Verify V08 author-reviewed validation planning stays fail-closed
        run: node research/seer-ppe/tools/validate_v08_author_review_planning_gate.mjs
      - name: Verify V09 Train-only unscored Workflow and human-reference safeguards
        run: node research/seer-ppe/tools/validate_v09_train_preflight_reference_gate.mjs
      - name: Verify V10 graph candidates and conservative record-contract regression
        run: |
          node research/seer-ppe/tools/validate_v10_source_components_and_guardrails.mjs --self-test
          node research/seer-ppe/tools/validate_v10_source_components_and_guardrails.mjs --verify
      - name: Verify V11 signed source-lineage and Person PPE validation contract fail closed
        run: |
          set -euo pipefail
          node research/seer-ppe/tools/validate_v11_source_and_person_ppe_gate.mjs --self-test
          node research/seer-ppe/tools/validate_v11_source_and_person_ppe_gate.mjs --audit > /tmp/seer-v11-audit.log
          grep -q 'SEER_V11_REAL_RECORD_GATE_FAIL_CLOSED_PASS' /tmp/seer-v11-audit.log
          if node research/seer-ppe/tools/validate_v11_source_and_person_ppe_gate.mjs --score research/seer-ppe/PERSON_PPE_EVAL_INPUT_CONTRACT_2026-11-21_V11.json > /tmp/seer-v11-blocked.log 2>&1; then
            echo 'UNSAFE_V11_SCORER_ACCEPTED_UNFROZEN_INPUT' >&2
            exit 1
          fi
          grep -q 'V11_GATE_BLOCKED' /tmp/seer-v11-blocked.log
          echo 'SEER_V11_UNSIGNED_FREEZE_AND_PROTECTED_TEST_POLICY_FAIL_CLOSED_PASS'
      - name: Verify V12 ranked Clean17 Valid candidate mapping cannot be mistaken for identity
        run: |
          node research/seer-ppe/tools/validate_v12_provisional_clean17_gate.mjs --self-test
          node research/seer-ppe/tools/validate_v12_provisional_clean17_gate.mjs --verify
      - name: Verify V12.2 Clean17 candidate and source-family hold conservation
        run: |
          node research/seer-ppe/tools/validate_v12_valid_eligibility_crosswalk.mjs --self-test
          node research/seer-ppe/tools/validate_v12_valid_eligibility_crosswalk.mjs --verify
      - name: Verify V13 individual Person PPE and source signoff remain fail closed
        run: |
          node research/seer-ppe/tools/validate_v13_pending_decisions.mjs --self-test
          node research/seer-ppe/tools/validate_v13_pending_decisions.mjs --verify
      - name: Verify V13 all 459 original valid image content and 50 cross-split source-pair safeguards
        run: |
          node research/seer-ppe/tools/validate_v13_full_media_and_source_gate.mjs --self-test
          node research/seer-ppe/tools/validate_v13_full_media_and_source_gate.mjs --verify
      - name: Verify V14 99-source direct content and six new technical quarantines fail closed
        run: |
          node research/seer-ppe/tools/validate_v14_quarantine_and_freeze.mjs --self-test
          node research/seer-ppe/tools/validate_v14_quarantine_and_freeze.mjs --verify
      - name: Verify V15 SHA-pinned per-source and Train-PPE signing safeguards fail closed
        run: |
          node research/seer-ppe/tools/compile_v15_source_qualification_and_ppe.mjs --self-test
          node research/seer-ppe/tools/compile_v15_source_qualification_and_ppe.mjs --audit /tmp/seer-v15-readiness.json > /tmp/seer-v15-readiness-log.txt
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const x=JSON.parse(fs.readFileSync("/tmp/seer-v15-readiness.json","utf8"));
            assert.equal(x.clean17_valid_count,459);
            assert.equal(x.per_image_source_family_human_decisions_signed,3);
            assert.equal(x.human_independence_attestations,0);
            assert.equal(x.scoring_ready,false);
            assert.equal(x.test_images_accessed,false);
            const signed=x.image_rows.filter(r=>r.signed_source_family_verdict!==null);
            assert.deepEqual(signed.map(r=>r.source_id).sort(),["0De0PEUDyeg9v1J3T6zr","NZu6Faj6evgINF1qFE0V","yeEvdkqXtNgsj7PZFDvI"].sort());
            for(const r of signed){
              if(r.source_id==="yeEvdkqXtNgsj7PZFDvI"){
                assert.equal(r.signed_source_family_verdict,"SHARED_SCENE_WITH_MODIFICATIONS_OR_PROCESSING");
                assert.equal(r.source_family_id,"scene_wa0026_wa0079_modified_processed");
              }else{
                assert.equal(r.signed_source_family_verdict,"SHARED_CAPTURE_SESSION_OR_SITE");
                assert.equal(r.source_family_id,"site_school_22may_aseefrah");
              }
              assert.equal(r.decision_status,"HARD_HOLD_STILL_BLOCKED");
              assert.equal(r.eligible_for_scientific_scoring,false);
            }
            assert.equal(x.source_eligibility_buckets.historical_holds,5);
            assert.equal(x.source_eligibility_buckets.technical_overlap_quarantine,6);
            assert.equal(x.candidate_ids_from_signed_independence.length,0);
          '
          grep -q 'SEER_V15_459_DIRECT_MEDIA_SOURCE_ATTESTATION_AND_PPE_READINESS_FAIL_CLOSED_PASS' /tmp/seer-v15-readiness-log.txt
      - name: Verify V15 independently signed original Valid human-gold contract is not fabricated
        run: |
          node research/seer-ppe/tools/validate_v15_validation_person_reference.mjs --self-test
          node research/seer-ppe/tools/validate_v15_validation_person_reference.mjs --audit > /tmp/seer-v15-human-gold.txt
          grep -q 'SEER_V15_NO_HUMAN_SIGNED_VALID_REFERENCE_YET_FAIL_CLOSED_PASS' /tmp/seer-v15-human-gold.txt
      - name: Enforce V15 scientific freeze not authorized by incomplete evidence
        run: |
          set -euo pipefail
          if node research/seer-ppe/tools/compile_v15_source_qualification_and_ppe.mjs --gate > /tmp/seer-v15-denied.txt 2>&1; then
            echo 'UNSAFE_V15_SCIENTIFIC_SCORE_AUTHORIZED_WITH_NO_SIGNED_COHORT' >&2
            exit 2
          fi
          grep -q 'V15_FREEZE_GATED_NO_SCIENTIFIC_SCORE' /tmp/seer-v15-denied.txt
          echo 'SEER_V15_FINAL_INDEPENDENT_VALIDATION_FREEZE_FAIL_CLOSED_PASS'
      - name: Verify V15 eleven priority Source IDs with no forged reviewer clearance
        run: |
          node research/seer-ppe/tools/validate_v15_priority_11_source_packets.mjs --self-test
          node research/seer-ppe/tools/validate_v15_priority_11_source_packets.mjs --verify
      - name: Verify V31-A 11-case Train-Valid source lineage reconciliation
        run: |
          node research/seer-ppe/tools/verify_v31a_source_reconciliation.mjs --self-test
          node research/seer-ppe/tools/verify_v31a_source_reconciliation.mjs --verify
      - name: Verify V31 completed V30 XAI does not falsely open source/person safety gate
        run: |
          node research/seer-ppe/tools/verify_v31_post_xai_readiness.mjs --self-test
          node research/seer-ppe/tools/verify_v31_post_xai_readiness.mjs --verify
      - name: Verify V31-A1 author-attested School 22 May site overlap and preserved holds
        run: |
          node research/seer-ppe/tools/verify_v31a1_author_site_attestation.mjs --self-test
          node research/seer-ppe/tools/verify_v31a1_author_site_attestation.mjs --verify
      - name: Verify V31-A2 author-attested WA0026-WA0079 shared scene with processing and preserved hold
        run: |
          node research/seer-ppe/tools/verify_v31a2_author_shared_scene.mjs --self-test
          node research/seer-ppe/tools/verify_v31a2_author_shared_scene.mjs --verify
      - name: Verify V31-A3 aggregate multi-project provenance and completed prior curation
        run: |
          node research/seer-ppe/tools/verify_v31a3_dataset_level_acquisition_curation.mjs --self-test
          node research/seer-ppe/tools/verify_v31a3_dataset_level_acquisition_curation.mjs --verify
      - name: Verify V33 actual target-matched A5/A6 numeric robustness with mutation tests (no model calls)
        run: |
          node research/seer-ppe/tools/verify_v33_existing_xai.mjs --self-test
          node research/seer-ppe/tools/verify_v33_existing_xai.mjs --verify
      - name: Verify V16 actual Roboflow Train-only predictions and abstention engineering regression
        run: |
          node research/seer-ppe/tools/review_real_train_detection_geometry_v16.mjs --self-test
          node research/seer-ppe/tools/review_real_train_detection_geometry_v16.mjs --audit /tmp/seer-v16-geometry.json > /tmp/seer-v16-geometry.log
          cmp research/seer-ppe/TRAIN_ONLY_PERSON_PPE_GEOMETRIC_REVIEW_V16.json /tmp/seer-v16-geometry.json
          grep -q 'SEER_V16_REAL_TRAIN_ONLY_DETECTION_METADATA_GEOMETRY_ABSTENTION_PASS' /tmp/seer-v16-geometry.log
      - name: Verify V16 existing human reference disallows unsafe PPE class conflicts
        run: |
          node research/seer-ppe/tools/triage_v16_train_cues_against_existing_reference.mjs --self-test
          node research/seer-ppe/tools/triage_v16_train_cues_against_existing_reference.mjs --audit /tmp/seer-v16-human-cue.json > /tmp/seer-v16-human-cue.log
          cmp research/seer-ppe/TRAIN_ONLY_DETECTOR_VS_ACCEPTED_HUMAN_REVIEW_V16.json /tmp/seer-v16-human-cue.json
          grep -q 'SEER_V16_ACTUAL_TRAIN_CUE_VS_HUMAN_REFERENCE_REVIEW_ONLY_PASS' /tmp/seer-v16-human-cue.log
      - name: Verify V17 deterministic paired Train policy guardrails and saved output integrity
        run: |
          node research/seer-ppe/tools/paired_train_policy_trace_v17.mjs --self-test
          node research/seer-ppe/tools/paired_train_policy_trace_v17.mjs --audit /tmp/seer-v17-paired.json > /tmp/seer-v17-paired.log
          cmp research/seer-ppe/PAIRED_TRAIN_DETECTOR_POLICY_TRACE_V17.json /tmp/seer-v17-paired.json
          grep -q 'SEER_V17_PAIRED_TRAIN_OFFLINE_NOT_SCIENTIFIC_SCORE_PASS' /tmp/seer-v17-paired.log
      - name: Verify V19 original author box scores and risk strata against numeric snapshots
        run: |
          node research/seer-ppe/tools/score_original_train_boxes_v19.mjs --self-test
          node research/seer-ppe/tools/score_original_train_boxes_v19.mjs --audit /tmp/seer-v19-matching.json > /tmp/seer-v19-matching.log
          cmp research/seer-ppe/TRAIN_SOURCE_LABEL_DETECTION_NUMERIC_PREFLIGHT_V19.json /tmp/seer-v19-matching.json
          grep -q 'SEER_V19_ACTUAL_ORIGINAL_TRAIN_ANNOTATION_MATCH_READ_ONLY_PASS' /tmp/seer-v19-matching.log
          node research/seer-ppe/tools/compute_validation_source_sensitivity_v19.mjs --self-test
          node research/seer-ppe/tools/compute_validation_source_sensitivity_v19.mjs --audit /tmp/seer-v19-overlap.json > /tmp/seer-v19-overlap.log
          cmp research/seer-ppe/VALIDATION_SOURCE_OVERLAP_NUMERIC_SENSITIVITY_V19.json /tmp/seer-v19-overlap.json
          grep -q 'SEER_V19_SOURCE_METADATA_ONLY_STRATIFICATION_NOT_INDEPENDENT_PASS' /tmp/seer-v19-overlap.log
      - name: Verify V20 historical model Valid-only counters and annotation drift without Test access
        run: |
          node research/seer-ppe/tools/compile_historical_valid_internal_metrics_v20.mjs --self-test
          node research/seer-ppe/tools/compile_historical_valid_internal_metrics_v20.mjs --audit /tmp/seer-v20-valid.json > /tmp/seer-v20-valid.log
          cmp research/seer-ppe/HISTORICAL_VALID_INTERNAL_METRICS_V20.json /tmp/seer-v20-valid.json
          grep -q 'SEER_V20_READ_ONLY_HISTORICAL_VALID_INTERNAL_STATS_NOT_INDEPENDENT_PASS' /tmp/seer-v20-valid.log
          echo 'SEER_V20_VALID_ONLY_459_448_367_SOURCE_ID_PAIRED_COUNTERS_AUDIT_PASS'
      - name: Verify V22 current Valid 17-class source composition and manuscript measured claims
        run: |
          node research/seer-ppe/tools/analyze_valid_class_support_v22.mjs --self-test
          node research/seer-ppe/tools/analyze_valid_class_support_v22.mjs --audit /tmp/seer-v22-valid-classes.json > /tmp/seer-v22-valid-classes.log
          cmp research/seer-ppe/VALID_CURRENT_CLASS_SUPPORT_RISK_COHORTS_V22.json /tmp/seer-v22-valid-classes.json
          grep -q 'SEER_V22_AUTHOR_VALID_CLASS_SOURCE_DISTRIBUTION_AUDIT_PASS' /tmp/seer-v22-valid-classes.log
          python - <<'PY'
          from pathlib import Path
          m=Path('research/seer-ppe/MANUSCRIPT_MASTER.md').read_text()
          for phrase in ('**Working manuscript v0.34', '### 3.17 Actual original-source',
                         '### 4.17 Current author-curated', '## 5. Discussion',
                         '## Appendix N.', '3,471', '3,049', '729',
                         '0.885018', '0.880754', '13'):
              assert phrase in m, phrase
          assert 'no new detector inference' in m.lower() or 'no new rfdetr inference' in m.lower()
          print('SEER_V22_MANUSCRIPT_METHODS_RESULTS_DISCUSSION_REFERENCES_SUPPORT_PASS')
          PY
          echo 'SEER_V22_VALID_CLASS_LABEL_COMPOSITION_AND_EDITORIAL_BOUNDARY_AUDIT_PASS'
      - name: Verify V23 five predeclared original Valid current author bbox result without Test access
        run: |
          node research/seer-ppe/tools/score_current_valid_source_boxes_v23.mjs --self-test
          node research/seer-ppe/tools/score_current_valid_source_boxes_v23.mjs --audit /tmp/seer-v23-valid-bbox.json > /tmp/seer-v23-valid-bbox.log
          cmp research/seer-ppe/VALID_CURRENT_SOURCE_REAL_MODEL_BOX_MATCH_V23.json /tmp/seer-v23-valid-bbox.json
          grep -q 'SEER_V23_FIXED_RFDETR_REAL_VALID_SOURCE_CURRENT_AUTHOR_BOX_MATCH_PASS' /tmp/seer-v23-valid-bbox.log
          python - <<'PY'
          from pathlib import Path
          m=Path('research/seer-ppe/MANUSCRIPT_MASTER.md').read_text()
          for phrase in ('**Working manuscript v0.34','### 3.18 Frozen five-image',
                         '### 4.18 Actual fixed original RF-DETR','## Appendix O.',
                         'TP=22, FP=1, FN=1','0.956522'):
              assert phrase in m, phrase
          print('SEER_V23_FIVE_ACTUAL_VALID_AUTHOR_BOX_MATCH_MANUSCRIPT_PASS')
          PY
          echo 'SEER_V23_HOSTED_ORIGINAL_VALID_CURRENT_LABELS_ACTUAL_5_IMAGE_PILOT_PASS'
      - name: Verify V24 official-publisher related work and cautious novelty boundary in manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('research/seer-ppe/MANUSCRIPT_MASTER.md').read_text(encoding='utf8')
          q=Path('research/seer-ppe/V24_VERIFIED_2024_2026_RELATED_WORK_NOVELTY_BOUNDARY.md').read_text(encoding='utf8')
          for phrase in ('**Working manuscript v0.34','### 2.2 Closest methodological',
                         '### 2.3 Provisional, falsifiable', '## Selected verified references',
                         '## Appendix P.', 'Selective Explanations',
                         '10.52202/079017-1765','10.3389/fbuil.2026.1976288',
                         '10.1016/j.aei.2026.104612','10.3390/jimaging12050195',
                         'not a PRISMA systematic search','remain unmeasured'):
              assert phrase in m, phrase
          for phrase in ('Paes', 'Vaghani', 'Bouguessa', 'Yi, Xu', 'Di Renzo',
                         'systematic review', 'publisher'):
              assert phrase.lower() in q.lower(), phrase
