name: Construction-PPE Clean Stage 2 Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r cross_domain_reliability/stage2_data_audit/requirements.txt

      - name: Fetch pinned official Construction-PPE YAML
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/construction_ppe_clean"
          curl --fail --location --retry 3 \
            -o "${RUNNER_TEMP}/construction_ppe_clean/construction-ppe.yaml" \
            "https://raw.githubusercontent.com/ultralytics/ultralytics/42044baf5eda3d52aa4bd7d8a098375d2c7fdad7/ultralytics/cfg/datasets/construction-ppe.yaml"
          sha256sum "${RUNNER_TEMP}/construction_ppe_clean/construction-ppe.yaml" > "${RUNNER_TEMP}/construction_ppe_clean/official_yaml.sha256"

      - name: Download official Construction-PPE archive
        id: download
        shell: bash
        run: |
          python cross_domain_reliability/stage2_data_audit/download_ultralytics_construction_ppe.py \
            --out "${RUNNER_TEMP}/construction_ppe_clean/download" \
            --metadata-out "${RUNNER_TEMP}/construction_ppe_clean/download_metadata.json"
          DATASET_ROOT="$(python - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'construction_ppe_clean','download_metadata.json')
          print(json.load(open(p,encoding='utf-8'))['dataset_root'])
          PY
          )"
          echo "dataset_root=${DATASET_ROOT}" >> "$GITHUB_OUTPUT"

      - name: Apply frozen conservative corrections
        id: correct
        shell: bash
        run: |
          python cross_domain_reliability/stage2_data_audit/apply_construction_ppe_stage2_corrections.py \
            --root "${{ steps.download.outputs.dataset_root }}" \
            --out "${RUNNER_TEMP}/Construction-PPE-clean" \
            --file-manifest "cross_domain_reliability/stage2_data_audit/results/Construction-PPE_conservative_file_correction_manifest_2026-09-20.csv" \
            --orphan-label-manifest "cross_domain_reliability/stage2_data_audit/results/Construction-PPE_orphan_label_removal_manifest_2026-09-20.csv" \
            --expected-exclusions 64 \
            --expected-orphan-removals 10 \
            --expected-exact-row-removals 1 \
            --summary-out "${RUNNER_TEMP}/construction_ppe_clean/correction_summary.json"
          echo "clean_root=${RUNNER_TEMP}/Construction-PPE-clean" >> "$GITHUB_OUTPUT"

      - name: Audit corrected derivative
        id: audit
        shell: bash
        run: |
          set +e
          python cross_domain_reliability/stage2_data_audit/stage2_dataset_audit.py \
            --dataset-name "Construction-PPE-clean" \
            --root "${{ steps.correct.outputs.clean_root }}" \
            --data-yaml "${RUNNER_TEMP}/construction_ppe_clean/construction-ppe.yaml" \
            --splits "train,val,test" \
            --near-hash-distance "4" \
            --out "${RUNNER_TEMP}/construction_ppe_clean/audit"
          CODE=$?
          set -e
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit explicit source groups
        id: source_groups
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "${RUNNER_TEMP}/construction_ppe_clean/audit/image_manifest.json" ]; then
            python cross_domain_reliability/stage2_data_audit/detect_source_group_leakage.py \
              --image-manifest "${RUNNER_TEMP}/construction_ppe_clean/audit/image_manifest.json" \
              --out "${RUNNER_TEMP}/construction_ppe_clean/source_groups"
            CODE=$?
          else
            CODE=2
          fi
          set -e
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build visual review evidence
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/construction_ppe_clean/audit/issues.json" ]; then
            python cross_domain_reliability/stage2_data_audit/build_visual_review_bundle.py \
              --dataset-root "${{ steps.correct.outputs.clean_root }}" \
              --issues "${RUNNER_TEMP}/construction_ppe_clean/audit/issues.json" \
              --splits "train,val,test" \
              --out "${RUNNER_TEMP}/construction_ppe_clean/visual_review"
          fi

      - name: Build compact overview
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from collections import Counter
          root=Path(os.environ['RUNNER_TEMP'])/'construction_ppe_clean'/'audit'
          issues=json.loads((root/'issues.json').read_text()) if (root/'issues.json').exists() else []
          summary=json.loads((root/'summary.json').read_text()) if (root/'summary.json').exists() else {}
          counts=Counter(x.get('issue_type','unknown') for x in issues)
          out={
            'summary':summary,
            'issue_count':len(issues),
            'issue_counts_by_type':dict(sorted(counts.items())),
            'core_audit_exit_code':int('${{ steps.audit.outputs.exit_code }}' or 0),
            'source_group_exit_code':int('${{ steps.source_groups.outputs.exit_code }}' or 0),
          }
          (Path(os.environ['RUNNER_TEMP'])/'construction_ppe_clean'/'clean_audit_overview.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY

      - name: Upload corrected audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-ppe-clean-stage2-audit
          path: |
            ${{ runner.temp }}/construction_ppe_clean/download_metadata.json
            ${{ runner.temp }}/construction_ppe_clean/construction-ppe.yaml
            ${{ runner.temp }}/construction_ppe_clean/official_yaml.sha256
            ${{ runner.temp }}/construction_ppe_clean/correction_summary.json
            ${{ runner.temp }}/construction_ppe_clean/clean_audit_overview.json
            ${{ runner.temp }}/construction_ppe_clean/audit/**
            ${{ runner.temp }}/construction_ppe_clean/source_groups/**
            ${{ runner.temp }}/construction_ppe_clean/visual_review/**
          if-no-files-found: warn
          retention-days: 30

      - name: Write summary
        if: always()
        shell: bash
        run: |
          echo "## Construction-PPE clean Stage 2 audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Official base: 1,416 images" >> "$GITHUB_STEP_SUMMARY"
          echo "- Conservative source-family image exclusions: 64 (55 train, 9 val, 0 test)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Orphan label files removed: 10" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact duplicate annotation rows removed: 1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected clean split: train=1077, val=134, test=141" >> "$GITHUB_STEP_SUMMARY"
          echo "- Core clean-audit exit code: ${{ steps.audit.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit source-group exit code: ${{ steps.source_groups.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw official source data are never overwritten or committed." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce clean audit gate
        if: always()
        shell: bash
        run: |
          CORE="${{ steps.audit.outputs.exit_code }}"; CORE="${CORE:-2}"
          SOURCE="${{ steps.source_groups.outputs.exit_code }}"; SOURCE="${SOURCE:-2}"
          if [ "$CORE" != "0" ] || [ "$SOURCE" != "0" ]; then
            echo "Construction-PPE clean Stage 2 gate failed (core=$CORE, source_group=$SOURCE)." >&2
            exit 2
          fi
