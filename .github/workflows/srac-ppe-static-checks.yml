name: SRAC-PPE Research Quality Gates

on:
  push:
    paths:
      - 'research/srac-ppe/tools/**'
      - '.github/workflows/srac-ppe-static-checks.yml'
  pull_request:
    paths:
      - 'research/srac-ppe/tools/**'
      - '.github/workflows/srac-ppe-static-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  group-independence-regressions:
    name: Provenance split integrity unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test provenance split gate
        run: python -m unittest discover -s research/srac-ppe/tools/tests -v
