name: SEER-PPE V30 frozen-input read-only verification

on:
  push:
    branches:
      - 'research/v30-progressive-xai-2026-11-22'
    paths:
      - '.github/workflows/seer-ppe-v30-cloud.yml'
      - 'research/seer-ppe/tools/fetch_v30_originals_cloud.py'
      - 'research/seer-ppe/tools/run_v30_progressive_xai.py'
      - 'research/seer-ppe/V30_FROZEN_TARGETS_2026-11-22.json'
      - 'research/seer-ppe/V30_BASELINE_PREFLIGHT_ACTUAL_2026-11-22.json'
permissions:
  contents: read

concurrency:
  group: seer-ppe-v30-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud_v30:
    name: Download frozen sources to ephemeral cloud runner without model inference
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cloud XAI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow inference-sdk
      - name: Validate Roboflow SDK inference configuration without model calls
        run: |
          python - <<'PY'
          from inference_sdk import InferenceConfiguration, InferenceHTTPClient
          cfg = InferenceConfiguration(
              api_key_transport="header",
              confidence_threshold=0.20,
              iou_threshold=0.50,
          )
          InferenceHTTPClient(
              api_url="https://serverless.roboflow.com", api_key="runtime-check-no-secret"
          ).configure(cfg)
          import importlib.util
          from pathlib import Path
          path = Path("research/seer-ppe/tools/run_v30_progressive_xai.py")
          spec = importlib.util.spec_from_file_location("v30_cloud_runner", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert callable(module.build_predictor)
          predictor = module.HostedPredictor("placeholder-key-no-request")
          assert predictor.client is not None
          assert callable(predictor.client.infer)
          assert predictor.calls == 0
          print("V30 hosted predictor constructor and SDK client passed; zero model calls")
          PY
      - name: Download only eight frozen Roboflow original images
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v30_originals"
          python research/seer-ppe/tools/fetch_v30_originals_cloud.py \
            --destination "${RUNNER_TEMP}/v30_originals" \
            --hashes-output "${RUNNER_TEMP}/v30_image_sha256.json"
      - name: Verify image filenames and dimensions (no model inference)
        run: |
          set -euo pipefail
          python research/seer-ppe/tools/run_v30_progressive_xai.py \
            --images-dir "${RUNNER_TEMP}/v30_originals" --dry-run
      - name: Verify downloaded images against frozen connector baseline (no model inference)
        run: |
          set -euo pipefail
          python research/seer-ppe/tools/run_v30_progressive_xai.py \
            --images-dir "${RUNNER_TEMP}/v30_originals" --preflight-only \
            --output "${RUNNER_TEMP}/v30_local_preflight.json"
      - name: Upload numeric evidence only; never upload original images or API keys
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v30-cloud-numeric-evidence
          path: |
            ${{ runner.temp }}/v30_image_sha256.json
            ${{ runner.temp }}/v30_local_preflight.json
            ${{ runner.temp }}/v30_numeric_results.json
          if-no-files-found: warn
          retention-days: 30
