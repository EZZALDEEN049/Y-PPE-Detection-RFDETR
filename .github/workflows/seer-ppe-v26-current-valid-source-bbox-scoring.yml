name: SEER-PPE V26 actual full original Valid current author reference 17-class box scoring
on:
  push:
    paths:
      - 'research/seer-ppe/V26_EXECUTE_SAVED_459_SOURCE_BOX_SCORING_REQUEST.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_source_full_459_current_reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all real archived V26 inputs and negative-control tests
        run: node research/seer-ppe/tools/score_original_valid_current_boxes_v26.mjs --self-test
      - name: Compute exact-class fixed confidence and IoU 0.5 current author original Source Valid results
        run: |
          node research/seer-ppe/tools/score_original_valid_current_boxes_v26.mjs --audit \
            research/seer-ppe/ACTUAL_CURRENT_SOURCE_ORIGINAL_VALID_459_CLASS_BBOX_METRICS_V26.json
      - name: Verify coverage and GT/pred accounting without Test or false safety claims
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p='research/seer-ppe/ACTUAL_CURRENT_SOURCE_ORIGINAL_VALID_459_CLASS_BBOX_METRICS_V26.json';
          const v=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(v.schema_version,'seer-ppe/v26-actual-original-valid-current-author-GT-detection-IoU50/v0.26');
          assert.equal(v.full_459_complete,true);
          assert.equal(v.original_model_id,'altayyar-0oflt-lafos-qqauz/2');
          assert.equal(v.fixed_hosted_model_confidence_floor,0.2);
          assert.equal(v.fixed_original_source_class_exact_greedy_bbox_IoU,0.5);
          assert.equal(v.V26_fresh_original_Valid_source_inferences,459);
          assert.equal(v.cohorts.M0.images_scored,459);
          assert.equal(v.cohorts.M1.images_scored,448);
          assert.equal(v.cohorts.M2.images_scored,367);
          assert.equal(v.cohorts.M0.current_original_author_GT_boxes,3471);
          assert.equal(v.cohorts.M1.current_original_author_GT_boxes,3433);
          assert.equal(v.cohorts.M2.current_original_author_GT_boxes,3049);
          assert.equal(v.cohorts.M0.current_author_model_assisted_annotation_markers,729);
          assert.equal(v.cohorts.M0.per_class.length,17);
          assert.equal(v.cohorts.M0.tp+v.cohorts.M0.fn,3471);
          assert.equal(v.cohorts.M0.tp+v.cohorts.M0.fp,v.cohorts.M0.new_original_RFDETR_model_boxes);
          assert.equal(v.protected_Test_accessed,false);
          assert.equal(v.source_independence_verified,false);
          assert.equal(v.SEER_policy_effectiveness_measured,false);
          assert.equal(v.individual_worker_safety_compliance_scored,false);
          assert.equal(v.XAI_faithfulness_and_energy_Joules_measured,false);
          assert.equal(v.strict_independent_worker_safety_scoring_ready,false);
          assert.equal(v.historical_2025_provider_eval_reference_is_not_same_current_GT,true);
          assert.equal(v.five_prior_V23_images_freshly_reinferred_not_reused,true);
          assert.equal(v.prespecified_descriptive_sensitivities.M0_minus_13_current_vs_old_GT_count_differences.images_scored,446);
          assert.equal(v.prespecified_descriptive_sensitivities.M0_minus_5_V23_pilot_exposures.images_scored,454);
          assert.equal(v.prespecified_descriptive_sensitivities.M2_minus_5_V23_pilot_exposures.images_scored,362);
          assert.equal(v.inference_or_source_failures.length,0);
          assert(v.cohorts.M0.tp>=0&&v.cohorts.M0.fp>=0&&v.cohorts.M0.fn>=0);
          assert(v.cohorts.M0.f1>=0&&v.cohorts.M0.f1<=1);
          console.log('SEER_V26_TRUE_459_FRESH_VALID_CURRENT_AUTHOR_BOXES_TP_FP_FN_COMPLETE_AND_SCOPE_SAFE');
          JS
      - name: Archive full current-source numeric outcomes with 459 exact ID matching detail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/seer-ppe/ACTUAL_CURRENT_SOURCE_ORIGINAL_VALID_459_CLASS_BBOX_METRICS_V26.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(seer-ppe): archive V26 full 459-original-valid current author GT and fixed model IoU50 metrics'
          git pull --rebase origin main
          git push origin HEAD:main
