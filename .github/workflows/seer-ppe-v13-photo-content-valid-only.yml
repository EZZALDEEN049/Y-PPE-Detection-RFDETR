name: SEER-PPE V13 direct Valid image corroboration (no model)
on:
  push:
    paths:
      - 'research/seer-ppe/V13_DIRECT_IMAGE_IDENTITY_REQUEST.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  direct_valid_only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image comparison dependencies
        run: python -m pip install 'roboflow>=1.1,<2' 'Pillow>=10,<13' 'numpy>=1.24,<3' 'opencv-python-headless>=4.8,<5' 'scikit-image>=0.22,<1'
      - name: Test synthetic picture comparison and negative control
        run: python research/seer-ppe/tools/verify_valid_original_to_clean17_pixels_v13.py --self-test
      - name: Download saved original Train Valid fingerprints metadata
        uses: actions/download-artifact@v4
        with:
          run-id: 44834307184
          name: seer-ppe-original-source-full-2093-metadata
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-metadata
      - name: Download saved frozen Clean17 file hashes metadata
        uses: actions/download-artifact@v4
        with:
          run-id: 42153641457
          name: seer-ppe-clean17-phase5-audit
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/clean-metadata
      - name: Get existing clone unaugmented export without training
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBOFLOW_API_KEY"
          python cross_domain_reliability/stage2_data_audit/download_roboflow_dataset.py \
            --workspace master-fylfq --project altayyar-0oflt-lafos-qqauz-ty5nh \
            --version 2 --format yolov11 --out "${RUNNER_TEMP}/private-export" \
            --metadata-out "${RUNNER_TEMP}/clone-location.json" > /dev/null
      - name: Verify original vs archive-hash pinned exported Valid image content only
        shell: bash
        run: |
          set -euo pipefail
          CLEAN="$(find "${RUNNER_TEMP}/clean-metadata" -type f -name clean17_file_manifest.csv -print -quit)"
          ROOT="$(python - <<'PY'
          import json,os,pathlib
          o=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'clone-location.json').read_text())
          assert o['workspace']=='master-fylfq' and o['version']==2
          print(o['dataset_location'])
          PY
          )"
          test -n "$CLEAN"
          python research/seer-ppe/tools/verify_valid_original_to_clean17_pixels_v13.py \
            --mode full \
            --crosswalk research/seer-ppe/SEER_PPE_VALID_TO_CLEAN17_PROVISIONAL_V12.json \
            --original-index research/seer-ppe/SOURCE_ID_MANIFEST_TRAIN_VALID_2026-11-19_V01.json \
            --original-report "${RUNNER_TEMP}/source-metadata/original-source-hash-audit.json" \
            --clean-manifest "$CLEAN" \
            --clean-root "$ROOT" \
            --report "${RUNNER_TEMP}/v13-evidence/valid-only-full.json"
      - name: Upload evidence metadata only and no image bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seer-ppe-v13-valid-only-direct-photo-full
          path: ${{ runner.temp }}/v13-evidence/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve research claims gate
        run: |
          python - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'v13-evidence/valid-only-full.json').read_text())
          assert x['requested']==459
          assert x['source_and_export_sha_verified']==459
          assert x['test_images_decoded']==0
          assert x['test_image_inference']==0
          assert x['images_uploaded'] is False
          assert x['scientific_scoring_ready'] is False
          print('SEER_V13_ALL_459_VALID_IMAGE_COMPARISON_GUARD_PASS')
          PY
