name: Roboflow Stage 2 Dataset Audit

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Roboflow workspace slug
        required: true
        default: master-fylfq
      project:
        description: Roboflow project slug
        required: true
        default: altayyar-0oflt-lafos-qqauz-ty5nh
      version:
        description: Roboflow dataset version
        required: true
        default: "1"
      export_format:
        description: Roboflow export format
        required: true
        default: yolov11
      dataset_name:
        description: Dataset display name for audit output
        required: true
        default: Y-PPE
      near_hash_distance:
        description: dHash Hamming distance for near-duplicate candidates
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install roboflow
          pip install -r cross_domain_reliability/stage2_data_audit/requirements.txt

      - name: Confirm Roboflow secret exists
        shell: bash
        run: |
          if [ -z "${ROBOFLOW_API_KEY}" ]; then
            echo "ROBOFLOW_API_KEY GitHub Actions secret is missing." >&2
            exit 1
          fi

      - name: Download Roboflow dataset version
        id: download
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/roboflow_downloads" "${RUNNER_TEMP}/stage2"
          python cross_domain_reliability/stage2_data_audit/download_roboflow_dataset.py \
            --workspace "${{ inputs.workspace }}" \
            --project "${{ inputs.project }}" \
            --version "${{ inputs.version }}" \
            --format "${{ inputs.export_format }}" \
            --out "${RUNNER_TEMP}/roboflow_downloads" \
            --metadata-out "${RUNNER_TEMP}/stage2/download_metadata.json"

          DATASET_DIR="$(python - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'stage2','download_metadata.json')
          print(json.load(open(p, encoding='utf-8'))['dataset_location'])
          PY
          )"
          echo "dataset_dir=${DATASET_DIR}" >> "$GITHUB_OUTPUT"

      - name: Locate dataset metadata and split names
        id: layout
        shell: bash
        run: |
          DATASET_DIR="${{ steps.download.outputs.dataset_dir }}"
          DATA_YAML="$(find "$DATASET_DIR" -maxdepth 3 \( -name data.yaml -o -name dataset.yaml \) -print -quit)"
          if [ -z "$DATA_YAML" ]; then
            echo "No data.yaml/dataset.yaml was found; semantic class-ID order cannot be frozen." >&2
            exit 1
          fi

          if [ -d "$DATASET_DIR/valid/images" ] || [ -d "$DATASET_DIR/images/valid" ] || [ -d "$DATASET_DIR/valid" ]; then
            SPLITS="train,valid,test"
          else
            SPLITS="train,val,test"
          fi

          echo "data_yaml=${DATA_YAML}" >> "$GITHUB_OUTPUT"
          echo "splits=${SPLITS}" >> "$GITHUB_OUTPUT"

      - name: Run read-only Stage 2 audit
        id: audit
        shell: bash
        run: |
          set +e
          python cross_domain_reliability/stage2_data_audit/stage2_dataset_audit.py \
            --dataset-name "${{ inputs.dataset_name }}" \
            --root "${{ steps.download.outputs.dataset_dir }}" \
            --data-yaml "${{ steps.layout.outputs.data_yaml }}" \
            --splits "${{ steps.layout.outputs.splits }}" \
            --near-hash-distance "${{ inputs.near_hash_distance }}" \
            --out "${RUNNER_TEMP}/stage2/audit"
          CODE=$?
          set -e
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build compact audit overview
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'stage2' / 'audit'
          issues_path = root / 'issues.json'
          summary_path = root / 'summary.json'
          out_path = Path(os.environ['RUNNER_TEMP']) / 'stage2' / 'audit_overview.json'

          issues = json.loads(issues_path.read_text(encoding='utf-8')) if issues_path.exists() else []
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else {}
          counts = Counter(x.get('issue_type','unknown') for x in issues)
          samples = defaultdict(list)
          for item in issues:
              key = item.get('issue_type','unknown')
              if len(samples[key]) < 10:
                  samples[key].append(item)

          critical_types = {
              'split_images_not_found','split_labels_not_found','malformed_label_row',
              'non_numeric_label','non_integer_class_id','class_id_out_of_range',
              'normalized_coordinate_invalid','box_outside_image','missing_label_file',
              'orphan_label_file','cross_split_exact_byte_duplicate',
              'cross_split_exact_pixel_duplicate'
          }
          overview = {
              'summary': summary,
              'issue_count': len(issues),
              'critical_issue_count': sum(v for k,v in counts.items() if k in critical_types),
              'issue_counts_by_type': dict(sorted(counts.items())),
              'sample_issues_by_type': dict(samples),
              'audit_exit_code': int('${{ steps.audit.outputs.exit_code }}' or 0),
          }
          out_path.write_text(json.dumps(overview, indent=2, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Upload full audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-${{ inputs.dataset_name }}-v${{ inputs.version }}
          path: |
            ${{ runner.temp }}/stage2/download_metadata.json
            ${{ runner.temp }}/stage2/audit/summary.json
            ${{ runner.temp }}/stage2/audit/image_manifest.json
            ${{ runner.temp }}/stage2/audit/issues.json
            ${{ runner.temp }}/stage2/audit_overview.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          echo "## Stage 2 Roboflow audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dataset: ${{ inputs.dataset_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workspace/project: ${{ inputs.workspace }}/${{ inputs.project }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Export: ${{ inputs.export_format }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Splits audited: ${{ steps.layout.outputs.splits }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audit exit code: ${{ steps.audit.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The downloadable artifact contains the full JSON audit outputs. A non-zero audit exit code indicates critical integrity/leakage findings that must be resolved before experiments." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce audit gate
        if: always()
        shell: bash
        run: |
          CODE="${{ steps.audit.outputs.exit_code }}"
          if [ -n "$CODE" ] && [ "$CODE" != "0" ]; then
            echo "Stage 2 audit found critical issues (exit code $CODE)." >&2
            exit "$CODE"
          fi
