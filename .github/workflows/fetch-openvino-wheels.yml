name: Fetch OpenVINO wheels

on:
  push:
    branches: [ecosafe-selective-experts]
    paths:
      - '.github/workflows/fetch-openvino-wheels.yml'
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Python 3.13 OpenVINO wheel set
        run: |
          mkdir wheelhouse
          python -m pip download --only-binary=:all: 'openvino>=2025.2.0' -d wheelhouse
          ls -lh wheelhouse
          sha256sum wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: openvino-py313-wheels
          path: wheelhouse/
          if-no-files-found: error
