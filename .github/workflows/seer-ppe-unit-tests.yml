name: SEER-PPE public engineering tests (no model training)
on:
  push:
    paths:
      - 'research/seer-ppe/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_synthetic_unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          pip install numpy scipy pillow
      - name: Run public-safe synthetic tests only (exclude private reviewer data fixtures)
        working-directory: research/seer-ppe
        run: |
          set -e
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_prototype.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_phase3.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_phase5.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_phase6.py' -v
