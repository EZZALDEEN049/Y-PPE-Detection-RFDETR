name: SEER-PPE public engineering tests (no model training)
on:
  push:
    paths:
      - 'research/seer-ppe/**'
      - '.github/workflows/seer-ppe-unit-tests.yml'
  pull_request:
    paths:
      - 'research/seer-ppe/**'
      - '.github/workflows/seer-ppe-unit-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public_synthetic_unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          pip install numpy scipy pillow matplotlib
      - name: Run public-safe synthetic tests only (exclude private reviewer data fixtures)
        working-directory: research/seer-ppe
        run: |
          set -e
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_prototype.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_phase3.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_phase5.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_phase6.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v30_progressive_xai.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v30_result_audit.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v33b_grid4_xai.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v34a_spatial_map_alignment.py' -v
          python -m py_compile tools/analyze_v34a_spatial_map_alignment.py
          python tools/analyze_v34a_spatial_map_alignment.py --output /tmp/V34A_SPATIAL_MAP_ALIGNMENT_RANK_CORRELATION_2026-11-22.json
          python -m py_compile seer_ppe/progressive_xai.py tools/run_v30_progressive_xai.py tools/audit_v30_xai_result.py tools/run_v33b_grid4_xai.py
          python tools/audit_v33b_grid4_xai.py --output /tmp/V33_B_GRID4_NUMERIC_AUDIT_2026-11-22.json
          python -m py_compile tools/audit_v33b_grid4_xai.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_v34b_scientific_figures.py' -v
          python -m py_compile tools/render_v34b_scientific_figures.py
          python tools/render_v34b_scientific_figures.py --output-dir /tmp/V34B_2026-11-22
      - name: Upload reproducible V34-B scientific figures and manifests
        uses: actions/upload-artifact@v4
        with:
          name: SEER-PPE-V34B-Scientific-Figures
          path: /tmp/V34B_2026-11-22/
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated V34-B figures to the research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/v30-progressive-xai-2026-11-22'
        run: |
          set -euo pipefail
          mkdir -p research/seer-ppe/figures
          cp -a /tmp/V34B_2026-11-22 research/seer-ppe/figures/V34B_2026-11-22
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/seer-ppe/figures/V34B_2026-11-22
          if ! git diff --cached --quiet; then
            git commit -m "Add V34-B data-derived scientific figures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "V34-B figures already match the reproducible render."
          fi
