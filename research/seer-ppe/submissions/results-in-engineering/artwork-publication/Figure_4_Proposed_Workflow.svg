<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">Proposed human-supervised PPE inspection workflow</title>
<desc id="desc">Field image and detector output are screened for target eligibility. Eligible targets can receive a consistency diagnostic. Ineligible, ambiguous or unstable detections require review. All pathways converge on human safety review; stable maps do not constitute compliance clearance.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#354b5a"/></marker></defs>
<rect width="1000" height="920" fill="#ffffff"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#142c3d">
<text x="500" y="32" font-size="22" font-weight="700" text-anchor="middle">Proposed human-supervised PPE inspection workflow</text>
<text x="500" y="55" font-size="14" text-anchor="middle">Conceptual placement of the studied diagnostic — not a field-validated system</text>
<rect x="250" y="78" width="500" height="67" rx="9" fill="#f5f8fa" stroke="#38536b" stroke-width="2"/><text x="500" y="103" font-size="17" font-weight="700" text-anchor="middle">1. Authorized image and fixed detector</text><text x="500" y="126" font-size="14" text-anchor="middle">Candidate object detections, not worker-level decisions</text>
<path d="M500 145 V165" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="165" width="500" height="84" rx="9" fill="#f5f8fa" stroke="#38536b" stroke-width="2"/><text x="500" y="190" font-size="17" font-weight="700" text-anchor="middle">2. Check target eligibility</text><text x="500" y="213" font-size="14" text-anchor="middle">Class, localization, score and geometry;</text><text x="500" y="232" font-size="14" text-anchor="middle">reference matching where available</text>
<path d="M500 249 V277" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="512" y="266" font-size="13">Eligible</text>
<path d="M250 207 H117 V306" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="131" y="195" font-size="13" text-anchor="middle">Not eligible / missing</text>
<rect x="20" y="306" width="194" height="102" rx="9" fill="#f9f4e9" stroke="#906c32" stroke-width="2"/><text x="117" y="331" font-size="17" font-weight="700" text-anchor="middle">Review required</text><text x="117" y="354" font-size="14" text-anchor="middle">Missing or uncertain</text><text x="117" y="373" font-size="14" text-anchor="middle">target; do not infer</text><text x="117" y="392" font-size="14" text-anchor="middle">PPE absence</text>
<rect x="250" y="277" width="500" height="104" rx="9" fill="#e6f0f5" stroke="#236684" stroke-width="2"/><text x="500" y="302" font-size="17" font-weight="700" text-anchor="middle">3. Sensitivity-map consistency diagnostic</text><text x="500" y="325" font-size="14" text-anchor="middle">8×8 vs 4×4; gray and blur controls where feasible</text><text x="500" y="344" font-size="14" text-anchor="middle">Rank agreement, top-region overlap,</text><text x="500" y="363" font-size="14" text-anchor="middle">and target-match ambiguity</text>
<path d="M500 381 V404" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="404" width="500" height="80" rx="9" fill="#f5f8fa" stroke="#38536b" stroke-width="2"/><text x="500" y="429" font-size="17" font-weight="700" text-anchor="middle">4. Interpret agreement and uncertainty</text><text x="500" y="452" font-size="14" text-anchor="middle">No validated acceptance cutoff; agreement is</text><text x="500" y="471" font-size="14" text-anchor="middle">not causal explanation correctness</text>
<path d="M390 484 V520 H272 V536" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610 484 V520 H760 V536" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="511" font-size="13" text-anchor="middle">Disagreement / undefined</text>
<text x="766" y="511" font-size="13" text-anchor="middle">Agreement</text>
<rect x="65" y="536" width="414" height="89" rx="9" fill="#f9f4e9" stroke="#906c32" stroke-width="2"/><text x="272" y="561" font-size="17" font-weight="700" text-anchor="middle">Flag instability or ambiguity</text><text x="272" y="584" font-size="14" text-anchor="middle">Review image and evidence;</text><text x="272" y="603" font-size="14" text-anchor="middle">record why the diagnostic is uncertain</text>
<rect x="553" y="536" width="414" height="89" rx="9" fill="#edf4ef" stroke="#4c7456" stroke-width="2"/><text x="760" y="561" font-size="17" font-weight="700" text-anchor="middle">Retain diagnostic evidence</text><text x="760" y="584" font-size="14" text-anchor="middle">Agreement does not certify compliance;</text><text x="760" y="603" font-size="14" text-anchor="middle">do not automatically clear a worker</text>
<path d="M117 408 V473 H25 V667 H240" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M272 625 V644 H420 V655" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 625 V644 H580 V655" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="655" width="520" height="100" rx="9" fill="#edf4ef" stroke="#4c7456" stroke-width="2"/><text x="500" y="680" font-size="17" font-weight="700" text-anchor="middle">5. Qualified human safety assessment</text><text x="500" y="703" font-size="14" text-anchor="middle">Confirm person–equipment association, task, site rules,</text><text x="500" y="722" font-size="14" text-anchor="middle">visibility and equipment suitability; seek further</text><text x="500" y="741" font-size="14" text-anchor="middle">evidence if any requirement is uncertain</text>
<path d="M500 755 V776" fill="none" stroke="#354b5a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="776" width="520" height="82" rx="9" fill="#f5f8fa" stroke="#38536b" stroke-width="2"/><text x="500" y="801" font-size="17" font-weight="700" text-anchor="middle">6. Document the human decision and follow-up</text><text x="500" y="824" font-size="14" text-anchor="middle">Authorized safety professional decides according to</text><text x="500" y="843" font-size="14" text-anchor="middle">site procedures; no automatic sanction or clearance</text>
<text x="500" y="888" font-size="14" font-weight="700" text-anchor="middle">Only the target-matched perturbation diagnostic was studied.</text>
<text x="500" y="908" font-size="13" text-anchor="middle">The full workflow, human decisions and safety outcomes have not been validated.</text>
</g></svg>